<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 Smart Intercom System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
    text-align:center;
}

/* TOP BAR */
#top{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#111826;
    font-size:13px;
}

/* CAMERA */
video{
    width:90%;
    max-width:500px;
    border-radius:10px;
    margin-top:10px;
    border:2px solid #1e2a3a;
}

/* BUTTONS */
button{
    width:90%;
    max-width:300px;
    margin:5px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1e2a3a;
    color:white;
}

/* STATUS */
#status{
    margin:10px;
    font-weight:bold;
}

/* ALARM FLASH */
@keyframes flash{
    0%{background:#0b0f14;}
    50%{background:#3b0000;}
    100%{background:#0b0f14;}
}
</style>
</head>

<body>

<div id="top">
    <div>📹 CAMERA: OFF</div>
    <div>🚪 DOOR: LOCKED</div>
    <div>🔔 INTERCOM: READY</div>
</div>

<h2>🔔 SMART INTERCOM V2</h2>

<video id="video" autoplay playsinline></video>

<div id="status">SYSTEM READY</div>

<button onclick="startCamera()">📹 Kamera starten</button>
<button onclick="ringBell()">🔔 Klingeln</button>
<button onclick="unlockDoor()">🚪 Tür öffnen</button>
<button onclick="lockDoor()">🔒 Tür schließen</button>
<button onclick="triggerAlarm()">🚨 ALARM</button>

<script>

let doorLocked = true;
let alarmActive = false;

/* 📹 CAMERA */
function startCamera(){
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream=>{
        document.getElementById("video").srcObject = stream;
        document.getElementById("status").innerText="CAMERA ACTIVE";
    })
    .catch(()=>{
        alert("Kamera Zugriff blockiert");
    });
}

/* 🔔 DOORBELL */
function ringBell(){
    document.getElementById("status").innerText="🔔 VISITOR DETECTED";

    document.body.style.animation="flash 0.3s infinite";

    setTimeout(()=>{
        if(!alarmActive){
            document.body.style.animation="";
        }
    },2000);
}

/* 🚪 DOOR CONTROL */
function unlockDoor(){
    doorLocked=false;
    document.getElementById("status").innerText="DOOR UNLOCKED";
}

function lockDoor(){
    doorLocked=true;
    document.getElementById("status").innerText="DOOR LOCKED";
}

/* 🚨 ALARM */
function triggerAlarm(){

    alarmActive=true;
    document.getElementById("status").innerText="🚨 INTRUSION ALERT";

    document.body.style.animation="flash 0.2s infinite";

    let freq=500;

    setInterval(()=>{

        const ctx=new (window.AudioContext||webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type="sawtooth";
        osc.frequency.value=freq;
        gain.gain.value=0.15;

        osc.start();
        osc.stop(ctx.currentTime+0.2);

        freq = (freq===500)?1200:500;

    },300);
}

</script>

</body>
</html>
