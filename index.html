<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Panel V8 Fixed</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #0b0f14;
    color: #00ff9c;
}

/* TOP */
.topbar {
    background: #111826;
    padding: 10px;
    text-align: center;
    border-bottom: 2px solid #00ff9c;
    font-size: 14px;
}

/* LOGIN */
.login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

/* PIN DISPLAY */
.pin-display {
    font-size: 28px;
    letter-spacing: 6px;
}

/* KEYPAD */
.pin-box {
    width: min(320px, 90vw);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

/* BUTTONS */
button.key {
    width: 100%;
    aspect-ratio: 1 / 1;
    font-size: 18px;
    background: #111826;
    color: #00ff9c;
    border: 1px solid #00ff9c;
    border-radius: 10px;
}

button.key:active {
    background: #00ff9c;
    color: #000;
}

/* BOTTOM ROW (0 + ENTER) */
.bottom-row {
    width: min(320px, 90vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* DASHBOARD */
.dashboard {
    display: none;
    padding: 10px;
}

/* PANEL */
.panel {
    background: #111826;
    border: 1px solid #00ff9c;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 10px;
    background: #00ff9c;
    color: #000;
    border: none;
    margin-top: 8px;
    border-radius: 6px;
}

/* VIDEO */
video {
    width: 100%;
    border-radius: 10px;
}

/* ALARM */
.alarm {
    animation: flash 0.5s infinite;
}

@keyframes flash {
    0% { background: #0b0f14; }
    50% { background: red; }
    100% { background: #0b0f14; }
}

</style>
</head>

<body>

<div class="topbar">SECURITY PANEL V8 FIX</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">

    <div class="pin-display" id="pinDisplay">----</div>

    <!-- 1-9 -->
    <div class="pin-box">
        <button class="key" onclick="press(1)">1</button>
        <button class="key" onclick="press(2)">2</button>
        <button class="key" onclick="press(3)">3</button>

        <button class="key" onclick="press(4)">4</button>
        <button class="key" onclick="press(5)">5</button>
        <button class="key" onclick="press(6)">6</button>

        <button class="key" onclick="press(7)">7</button>
        <button class="key" onclick="press(8)">8</button>
        <button class="key" onclick="press(9)">9</button>
    </div>

    <!-- bottom -->
    <div class="bottom-row">
        <button class="key" onclick="press(0)">0</button>
        <button class="key" onclick="checkPin()">ENTER</button>
    </div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<div class="panel">
    <h3>STATUS</h3>
    <div>System ARMED</div>
</div>

<div class="panel">
    <h3>CAMERA</h3>
    <video id="video" autoplay></video>
    <button class="btn" onclick="startCamera()">Start Camera</button>
</div>

<div class="panel">
    <h3>ALARM</h3>
    <button class="btn" onclick="triggerAlarm()">TRIGGER</button>
    <button class="btn" onclick="resetAlarm()">RESET</button>
</div>

</div>

<audio id="smokeAlarm" loop>
  <source src="salamisound-7927385-rauchmelder-30-sekunden-10-x.mp3" type="audio/mpeg">
</audio>

<script>
let pin = "";
const correctPin = "1234";
let alarm = false;

function press(n){
    if(pin.length < 4){
        pin += n;
        document.getElementById("pinDisplay").innerText = pin.padEnd(4,"-");
    }
}

function checkPin(){
    if(pin === correctPin){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        alert("Falscher PIN");
        pin = "";
        document.getElementById("pinDisplay").innerText = "----";
    }
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => document.getElementById("video").srcObject = stream)
    .catch(()=>alert("Kamera blockiert"));
}

function triggerAlarm(){
    if(alarm) return;
    alarm = true;
    document.body.classList.add("alarm");
    document.getElementById("smokeAlarm").play();
}

function resetAlarm(){
    alarm = false;
    document.body.classList.remove("alarm");
    let a = document.getElementById("smokeAlarm");
    a.pause();
    a.currentTime = 0;
}
</script>

</body>
</html>
