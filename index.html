<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Security Panel</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0f14;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* LOGIN SCREEN */
#loginScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #1b2a3a, #05070a);
  display: flex;
  justify-content: center;
  align-items: center;
}

.loginBox {
  background: #111824;
  padding: 30px;
  border-radius: 12px;
  width: min(90vw, 320px);
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
}

.loginBox h1 {
  margin-bottom: 15px;
  font-size: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  text-align: center;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #1f6feb;
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 16px;
}

/* MAIN PANEL */
#panel {
  display: none;
  height: 100vh;
  width: 100vw;
  flex-direction: column;
}

/* TOP BAR */
.topbar {
  background: #111824;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.status {
  font-size: 14px;
  color: #7ee787;
}

/* GRID LAYOUT */
.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  padding: 10px;
  overflow-y: auto;
}

/* CARD */
.card {
  background: #121a26;
  border-radius: 10px;
  padding: 10px;
  min-height: 120px;
}

.card h3 {
  font-size: 14px;
  margin-bottom: 8px;
  color: #58a6ff;
}

/* ZONES */
.zone {
  padding: 8px;
  margin: 5px 0;
  border-radius: 6px;
  background: #1b2635;
  font-size: 13px;
}

/* CCTV */
.cctv {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}

.cam {
  background: #000;
  height: 70px;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}

.cam video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* LOG */
.log {
  font-size: 12px;
  max-height: 160px;
  overflow-y: auto;
}

/* EXIT OVERLAY */
#exitOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
}

.exitBox {
  background: #111824;
  padding: 20px;
  border-radius: 10px;
  width: min(90vw, 300px);
  text-align: center;
}

/* ALARM FLASH */
.alarm {
  animation: flash 0.2s infinite;
}

@keyframes flash {
  0% { background: red; }
  50% { background: black; }
  100% { background: red; }
}

/* MOBILE FIX */
@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>SECURITY LOGIN</h1>
    <input type="password" id="pin" placeholder="PIN">
    <button onclick="login()">ENTER</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel">
  <div class="topbar">
    <div class="status">🟢 SYSTEM ARMED</div>
    <button onclick="goFullscreen()">Fullscreen</button>
  </div>

  <div class="grid">

    <div class="card">
      <h3>ZONES</h3>
      <div class="zone">🚪 Door: CLOSED</div>
      <div class="zone">👁 Motion: ACTIVE</div>
      <div class="zone">🪟 Window: SECURE</div>
    </div>

    <div class="card">
      <h3>CCTV</h3>
      <div class="cctv">
        <div class="cam"><video autoplay muted playsinline id="cam1"></video></div>
        <div class="cam"></div>
        <div class="cam"></div>
        <div class="cam"></div>
      </div>
    </div>

    <div class="card">
      <h3>EVENT LOG</h3>
      <div class="log" id="log"></div>
    </div>

  </div>
</div>

<!-- EXIT PIN -->
<div id="exitOverlay">
  <div class="exitBox">
    <h3>EXIT SECURITY MODE</h3>
    <input type="password" id="exitPin" placeholder="EXIT PIN">
    <button onclick="checkExit()">CONFIRM</button>
  </div>
</div>

<script>
const LOGIN_PIN = "1234";
const EXIT_PIN = "0000";

function log(msg){
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

function login(){
  const pin = document.getElementById("pin").value;
  if(pin === LOGIN_PIN){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("panel").style.display = "flex";
    log("System armed");
    startCamera();
  } else {
    alert("Wrong PIN");
  }
}

function goFullscreen(){
  document.documentElement.requestFullscreen?.();
  log("Fullscreen enabled");
}

/* ESC EXIT */
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    document.getElementById("exitOverlay").style.display = "flex";
  }
});

function checkExit(){
  const pin = document.getElementById("exitPin").value;
  if(pin === EXIT_PIN){
    location.reload();
  } else {
    triggerAlarm();
  }
}

/* CAMERA */
async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById("cam1").srcObject = stream;
    log("Camera online");
  } catch(e){
    log("Camera access denied");
  }
}

/* ALARM */
function triggerAlarm(){
  document.body.classList.add("alarm");
  log("ALARM TRIGGERED");

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.value = 900;
  osc.connect(ctx.destination);
  osc.start();

  setTimeout(() => {
    osc.stop();
    document.body.classList.remove("alarm");
  }, 3000);

  alert("ALARM! Wrong PIN");
}
</script>

</body>
</html>
