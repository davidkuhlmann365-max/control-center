<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V10 Security Panel + Camera</title>

<style>
body{
margin:0;
background:#05070c;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00ffcc;
}

.panel{
width:720px;
background:#0b0f14;
border:2px solid #1affc6;
box-shadow:0 0 25px #00ffcc33;
display:flex;
flex-direction:column;
}

/* TOP LAYOUT */
.top{
display:flex;
}

.floor{
width:50%;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px;
background:#070a10;
}

.room{
border:1px solid #1affc6;
padding:14px;
text-align:center;
cursor:pointer;
background:#0d141d;
font-size:12px;
}

.ok{background:#0d141d;}
.open{background:#ff3b3b66;}
.trouble{background:#ffcc0040;}
.offline{background:#66666655;}

/* CAMERA */
.cam{
width:50%;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
border-left:1px solid #1affc6;
}

video{
width:100%;
height:260px;
object-fit:cover;
}

.snap{
width:100%;
height:120px;
background:#000;
border-top:1px solid #1affc6;
font-size:11px;
color:#00ff88;
overflow:auto;
padding:6px;
}

/* BOTTOM */
.bottom{
border-top:1px solid #1affc6;
padding:10px;
background:black;
}

.screen{
color:#00ff88;
min-height:60px;
white-space:pre-line;
}

.log{
height:110px;
overflow:auto;
font-size:11px;
margin-top:5px;
}
</style>
</head>

<body>

<div class="panel">

<div class="top">

<!-- FLOOR -->
<div class="floor">

<div class="room" id="door" onclick="trigger('door')">DOOR</div>
<div class="room" id="window" onclick="trigger('window')">WINDOW</div>
<div class="room" id="motion" onclick="trigger('motion')">MOTION</div>
<div class="room" id="smoke" onclick="trigger('smoke')">SMOKE</div>

</div>

<!-- CAMERA -->
<div class="cam">
<video id="video" autoplay></video>
<div class="snap" id="snap">SNAPSHOT LOG</div>
</div>

</div>

<div class="bottom">
<div class="screen" id="screen">SYSTEM READY</div>
<div class="log" id="log"></div>
</div>

</div>

<script>

/* ---------------- CAMERA ---------------- */
const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:true,audio:false})
.then(stream=>{
video.srcObject=stream;
})
.catch(e=>{
console.log("Camera blocked");
});

/* ---------------- SYSTEM ---------------- */
let zones={
door:{state:"CLOSED",battery:100,online:true},
window:{state:"CLOSED",battery:100,online:true},
motion:{state:"CLOSED",battery:100,online:true},
smoke:{state:"CLOSED",battery:100,online:true}
};

let alarm=false;
let trouble=false;

/* ---------------- AUDIO ---------------- */
let ctx,osc,loop;

function initAudio(){
if(!ctx)ctx=new AudioContext();
}

function stopSound(){
if(loop)clearInterval(loop);
if(osc){try{osc.stop();}catch(e){}}
}

/* ---------------- SOUND ---------------- */
function alarmSound(){
stopSound();
initAudio();

osc=ctx.createOscillator();
let g=ctx.createGain();

osc.connect(g);g.connect(ctx.destination);

osc.type="square";
g.gain.value=0.05;

osc.start();

let up=false;

loop=setInterval(()=>{
osc.frequency.value=up?900:400;
up=!up;
},220);
}

/* ---------------- SNAPSHOT ---------------- */
function snapshot(event){
let time=new Date().toLocaleTimeString();
let log=document.getElementById("snap");

log.innerText+=`\n[${time}] EVENT: ${event}`;
log.scrollTop=999999;
}

/* ---------------- UI ---------------- */
function screen(t){
document.getElementById("screen").innerText=t;
}

function log(m){
let t=new Date().toLocaleTimeString();
let el=document.createElement("div");
el.innerText=`[${t}] ${m}`;
document.getElementById("log").appendChild(el);
}

/* ---------------- FLOOR ---------------- */
function updateFloor(){

for(let z in zones){
let el=document.getElementById(z);
let r=zones[z];

el.className="room ok";

if(r.state==="OPEN") el.classList.add("open");
if(!r.online) el.classList.add("trouble");

el.innerText=`${z.toUpperCase()}\n${r.state}`;
}
}

/* ---------------- SYSTEM ---------------- */
function checkSystem(){

alarm=false;
trouble=false;

for(let z in zones){
if(zones[z].state==="OPEN") alarm=true;
if(!zones[z].online) trouble=true;
}

if(alarm){
screen("ALARM ACTIVE");
alarmSound();
snapshot("ALARM TRIGGERED");
}

else if(trouble){
screen("SYSTEM TROUBLE");
}

else{
screen("SYSTEM READY");
}
}

/* ---------------- SIMULATION ---------------- */
function simulate(){

for(let z in zones){

if(Math.random()<0.01){
zones[z].state="OPEN";
snapshot(z+" OPEN");
}

if(Math.random()<0.005){
zones[z].online=false;
log(z+" OFFLINE");
}

if(Math.random()<0.01){
zones[z].state="CLOSED";
zones[z].online=true;
}

}

updateFloor();
checkSystem();
}

/* ---------------- TRIGGER ---------------- */
function trigger(z){
zones[z].state="OPEN";
snapshot(z+" MANUAL TRIGGER");
log(z+" TRIGGERED");
checkSystem();
updateFloor();
}

/* LOOP */
setInterval(simulate,4000);

updateFloor();

</script>

</body>
</html>
