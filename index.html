<style>
body{
    margin:0;
    background:#000;
    color:#00ff99;
    font-family: monospace;
    overflow:hidden;
}

/* 🧠 Auto Scaling App Container */
#app{
    display:none;
    height:100vh;
    width:100vw;
    padding:8px;
    box-sizing:border-box;
    overflow:hidden;
}

/* Login bleibt zentriert */
#login{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

/* 📱 Compact Grid */
.panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    width:100%;
    height:100%;
}

/* smaller boxes */
.box{
    border:1px solid #00ff99;
    padding:6px;
    font-size:12px;
    overflow:hidden;
}

/* buttons smaller */
button{
    margin:2px;
    padding:4px 6px;
    font-size:12px;
}

/* log smaller */
.log{
    height:80px;
    overflow:auto;
    font-size:10px;
    border:1px solid #00ff99;
    padding:4px;
}

/* camera scaling fix */
video{
    width:100%;
    max-height:120px;
    border:1px solid #00ff99;
}

/* house grid compact */
.house{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
}

.zone{
    border:1px solid #00ff99;
    padding:5px;
    font-size:11px;
    text-align:center;
    cursor:pointer;
}

/* status text smaller */
h2,h3,p{
    margin:4px 0;
    font-size:13px;
}
</style>
