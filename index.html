<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FIRE SYSTEM PRO V4</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f14;
color:#00ff9d;
}

#top{
background:#111;
padding:10px;
display:flex;
justify-content:space-between;
}

#wrap{
display:flex;
height:100vh;
}

#left{
width:360px;
background:#0f1720;
padding:10px;
}

button{
width:100%;
margin:5px 0;
padding:10px;
background:#111;
border:1px solid #00ff9d;
color:#00ff9d;
cursor:pointer;
}

button:hover{
background:#00ff9d;
color:black;
}

#log{
margin-top:10px;
height:220px;
overflow:auto;
background:black;
padding:5px;
font-size:12px;
}

.zone{
background:black;
padding:6px;
margin-top:6px;
font-size:12px;
border:1px solid #222;
}
</style>
</head>

<body>

<div id="top">
<div>🔥 FIRE SYSTEM PRO V4</div>
<div id="status">DISARMED</div>
</div>

<div id="wrap">

<div id="left">

<h3>MODES</h3>
<button onclick="setMode('HOME')">HOME</button>
<button onclick="setMode('AWAY')">AWAY</button>
<button onclick="setMode('DISARMED')">DISARM</button>

<h3>FIRE CONTROL</h3>
<button onclick="trigger('smoke')">SMOKE</button>
<button onclick="trigger('fire')">FIRE</button>
<button onclick="trigger('motion')">MOTION</button>

<button onclick="triggerFire()">🔥 FIRE SYSTEM</button>
<button onclick="panic()">🚨 PANIC</button>
<button onclick="stopAll()">STOP</button>

<div class="zone">Door: OK</div>
<div class="zone">Window: OK</div>
<div class="zone">Motion: OK</div>

<div id="log"></div>

</div>

</div>

<script>

/* =====================
   🧠 STATE ENGINE
===================== */

const STATE = {
mode:"DISARMED",
alarm:false,
panic:false,
fire:"NONE",
token:0
};

let audioCtx;
let voiceOverride=false;

/* =====================
   LOG
===================== */

function log(msg){
const t=new Date().toLocaleTimeString();
document.getElementById("log").innerHTML+=`[${t}] ${msg}<br>`;
}

/* =====================
   STATUS
===================== */

function setStatus(){
document.getElementById("status").innerText =
STATE.mode + (STATE.alarm ? " | ALARM":"") + (STATE.fire!=="NONE" ? " | FIRE":"");
}

/* =====================
   AUDIO ENGINE
===================== */

function beep(f=3000,d=0.12){
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();

o.frequency.value=f;
o.type="square";

o.connect(g);
g.connect(audioCtx.destination);

o.start();
setTimeout(()=>o.stop(),d*1000);
}

/* =====================
   FLASH
===================== */

function flash(c="rgba(255,0,0,0.4)"){
document.body.style.background=c;
setTimeout(()=>document.body.style.background="#0b0f14",100);
}

/* =====================
   PA SYSTEM (Echo)
===================== */

function paSpeak(text, lang="en-US"){

if(voiceOverride) return;

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);
msg.lang=lang;
msg.rate=1;
msg.pitch=0.85;
msg.volume=1;

speechSynthesis.speak(msg);

setTimeout(()=>{
if(voiceOverride) return;

const echo=new SpeechSynthesisUtterance(text);
echo.lang=lang;
echo.rate=0.9;
echo.pitch=0.8;
echo.volume=0.35;

speechSynthesis.speak(echo);
},600);
}

/* =====================
   CONTROL CENTER VOICE
===================== */

function controlCenter(text){
voiceOverride=true;
speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);
msg.lang="en-US";
msg.rate=1;
msg.pitch=0.8;

msg.onend=()=>voiceOverride=false;

speechSynthesis.speak(msg);
}

/* =====================
   EVACUATION VOICE
===================== */

function evac(level){

if(level==="SMOKE"){
paSpeak("Smoke detected in the building.","en-US");
setTimeout(()=>paSpeak("Rauch im Gebäude festgestellt.","de-DE"),1000);
}

if(level==="FIRE"){
paSpeak("Fire detected. Prepare to evacuate.","en-US");
setTimeout(()=>paSpeak("Feuer im Gebäude. Evakuierung vorbereiten.","de-DE"),1000);
}

if(level==="CRITICAL"){
paSpeak("Leave the building immediately.","en-US");
setTimeout(()=>paSpeak("Gebäude sofort verlassen.","de-DE"),1000);
}
}

/* =====================
   FIRE ENGINE
===================== */

function fireEngine(t){

if(!STATE.alarm || STATE.token!==t) return;

let freq=1800;

if(STATE.fire==="SMOKE") freq=1500;
if(STATE.fire==="FIRE") freq=2000;
if(STATE.fire==="CRITICAL") freq=2600;

const o=audioCtx.createOscillator();
const g=audioCtx.createGain();

o.frequency.value=freq;
o.type="sawtooth";
g.gain.value=0.3;

o.connect(g);
g.connect(audioCtx.destination);

o.start();
setTimeout(()=>o.stop(),500);

flash(
STATE.fire==="SMOKE"?"rgba(255,80,0,0.3)":
STATE.fire==="FIRE"?"rgba(255,40,0,0.5)":
"rgba(255,0,0,0.8)"
);

setTimeout(()=>{

if(STATE.fire==="SMOKE") STATE.fire="FIRE";
if(STATE.fire==="FIRE" && Math.random()>0.7) STATE.fire="CRITICAL";

evac(STATE.fire);

setTimeout(()=>fireEngine(t), STATE.fire==="CRITICAL"?600:1000);

},800);
}

/* =====================
   TRIGGER SYSTEM
===================== */

function trigger(type){

if(STATE.mode==="DISARMED") return;

if(!audioCtx) audioCtx=new AudioContext();

STATE.alarm=true;
STATE.token++;

if(type==="smoke"){
STATE.fire="SMOKE";
log("SMOKE TRIGGER");
}

if(type==="fire"){
STATE.fire="FIRE";
log("FIRE TRIGGER");
}

if(type==="motion"){
log("MOTION TRIGGER");
beep(2800,0.1);
}

fireEngine(STATE.token);
setStatus();
}

/* =====================
   FIRE START
===================== */

function triggerFire(){
if(!audioCtx) audioCtx=new AudioContext();

STATE.alarm=true;
STATE.token++;
STATE.fire="SMOKE";

log("🔥 FIRE SYSTEM START");

evac("SMOKE");
fireEngine(STATE.token);

setStatus();
}

/* =====================
   PANIC
===================== */

function panic(){
if(!audioCtx) audioCtx=new AudioContext();

STATE.alarm=true;
STATE.panic=true;
STATE.token++;

log("🚨 PANIC");

let i=0;
function st(){
flash("rgba(255,0,0,0.9)");
if(i++<40) setTimeout(st,80);
}
st();

fireEngine(STATE.token);
}

/* =====================
   MODE
===================== */

function setMode(m){
STATE.mode=m;
STATE.token++;
STATE.alarm=false;
STATE.fire="NONE";

log("MODE "+m);
setStatus();
}

/* =====================
   STOP
===================== */

function stopAll(){

STATE.alarm=false;
STATE.panic=false;
STATE.fire="NONE";
STATE.token++;

speechSynthesis.cancel();

document.body.style.background="#0b0f14";

log("STOP");
setStatus();
}

setStatus();

</script>

</body>
</html>
