<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alarmzentrale</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
  }

  header {
    padding: 16px;
    text-align: center;
    background: #111826;
    font-size: 20px;
    font-weight: bold;
  }

  .status {
    text-align: center;
    padding: 10px;
    color: #aaa;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 12px;
  }

  .panel {
    background: #151c28;
    border-radius: 12px;
    padding: 15px;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    color: white;
  }

  .alarm { background: #ff3b3b; }
  .reset { background: #2ecc71; }
  .test  { background: #2b6cff; }

  button:active {
    transform: scale(0.98);
  }
</style>
</head>

<body>

<header>🚨 Alarmzentrale</header>
<div class="status">Status: <span id="status">Standby</span></div>

<div class="container">

  <div class="panel">
    <h3>Feueralarm</h3>
    <button class="alarm" onclick="triggerAlarm()">ALARM AUSLÖSEN</button>
  </div>

  <div class="panel">
    <h3>System</h3>
    <button class="reset" onclick="resetSystem()">RESET</button>
  </div>

  <div class="panel">
    <h3>Test</h3>
    <button class="test" onclick="testSound()">TON TEST</button>
  </div>

</div>

<script>
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// einfacher „Bahnhof / Sirenen“-Sound
function playAlarmSound(duration = 1000, frequency = 800) {
  initAudio();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  setTimeout(() => {
    osc.stop();
  }, duration);
}

function triggerAlarm() {
  document.getElementById("status").innerText = "🚨 ALARM!";
  document.body.style.background = "#2a0000";

  // Sirenen-Effekt
  let i = 0;
  const interval = setInterval(() => {
    playAlarmSound(200, 600 + (i % 2) * 300);
    i++;
    if (i > 10) clearInterval(interval);
  }, 250);
}

function resetSystem() {
  document.getElementById("status").innerText = "Standby";
  document.body.style.background = "#0b0f14";
}

function testSound() {
  playAlarmSound(500, 700);
}
</script>

</body>
</html>
