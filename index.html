<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Security Tablet</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0a0f14;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* LOGIN */
#login{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1c2a3a,#05070a);
}

.box{
  width:min(90vw,320px);
  background:#111824;
  padding:25px;
  border-radius:12px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
  text-align:center;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#1f6feb;
  color:white;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#111824;
  align-items:center;
}

/* APP */
#app{
  display:none;
  height:100vh;
  flex-direction:column;
}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  padding:10px;
  overflow:auto;
}

/* CARD */
.card{
  background:#121a26;
  border-radius:10px;
  padding:10px;
}

/* ZONES */
.zone{
  background:#1b2635;
  padding:6px;
  margin-top:5px;
  border-radius:6px;
  font-size:12px;
}

/* CAM GRID */
.camGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.cam{
  background:black;
  height:90px;
  border-radius:6px;
  overflow:hidden;
  position:relative;
}

.cam video,
.cam canvas{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* LOG */
#log{
  font-size:12px;
  max-height:180px;
  overflow:auto;
}

/* ALERT STATE */
.alarm{
  animation:flash .2s infinite;
}

@keyframes flash{
  0%{background:red}
  50%{background:black}
  100%{background:red}
}

/* LOCKDOWN */
.lockdown{
  filter:contrast(2) saturate(0);
}

/* BANNER */
#banner{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:#1f6feb;
  padding:8px 12px;
  border-radius:8px;
  display:none;
  font-size:13px;
}
</style>
</head>

<body>

<div id="banner"></div>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h3>SECURITY LOGIN</h3>
    <input type="password" id="pin" placeholder="PIN">
    <button onclick="login()">ENTER</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div>🟢 SYSTEM</div>
    <button onclick="startFullscreen()">Fullscreen</button>
  </div>

  <div class="grid">

    <!-- ZONES -->
    <div class="card">
      <h3>ZONES</h3>
      <div class="zone">Door: OK</div>
      <div class="zone">Window: OK</div>
      <div class="zone">Motion: <span id="motionState">idle</span></div>
    </div>

    <!-- CAMERAS -->
    <div class="card">
      <h3>CAMERAS</h3>
      <div class="camGrid">
        <div class="cam"><video id="cam0" autoplay muted playsinline></video></div>
        <div class="cam"><canvas id="fake1"></canvas></div>
        <div class="cam"><canvas id="fake2"></canvas></div>
        <div class="cam"><canvas id="motionCam"></canvas></div>
      </div>
    </div>

    <!-- LOG -->
    <div class="card">
      <h3>LOG</h3>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>

const PIN="1234";
let fail=0;
let audio;
let alarmRunning=false;

/* AUDIO ENGINE */
function initAudio(){
  audio = audio || new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended") audio.resume();
}

/* UI */
function banner(msg){
  const b=document.getElementById("banner");
  b.innerText=msg;
  b.style.display="block";
  setTimeout(()=>b.style.display="none",1500);
}

function log(msg){
  document.getElementById("log").innerHTML=
  `[${new Date().toLocaleTimeString()}] ${msg}<br>`+
  document.getElementById("log").innerHTML;
}

/* LOGIN */
function login(){
  initAudio();

  const p=document.getElementById("pin").value;

  if(p===PIN){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="flex";
    banner("ACCESS GRANTED");
    startCam();
    fakeCams();
    motionDetect();
  }else{
    fail++;
    banner("ACCESS DENIED");

    if(fail>=3){
      lockdown();
    }else{
      startAlarm();
    }
  }
}

/* FULLSCREEN */
function startFullscreen(){
  document.documentElement.requestFullscreen?.();
}

/* CAMERA */
async function startCam(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById("cam0").srcObject=stream;
    log("Live camera active");
  }catch(e){
    log("Camera blocked");
  }
}

/* FAKE CAMS */
function fakeCams(){
  ["fake1","fake2","motionCam"].forEach(id=>{
    const c=document.getElementById(id);
    const ctx=c.getContext("2d");

    function draw(){
      ctx.fillStyle="black";
      ctx.fillRect(0,0,c.width,c.height);

      for(let i=0;i<80;i++){
        ctx.fillStyle=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
        ctx.fillRect(Math.random()*200,Math.random()*100,2,2);
      }

      requestAnimationFrame(draw);
    }
    draw();
  });
}

/* MOTION DETECTION */
function motionDetect(){
  const v=document.getElementById("cam0");
  const canvas=document.getElementById("motionCam");
  const ctx=canvas.getContext("2d");

  const tmp=document.createElement("canvas");
  const tctx=tmp.getContext("2d");

  let last=null;

  function loop(){
    if(v.readyState>=2){
      tmp.width=canvas.width=160;
      tmp.height=canvas.height=120;

      tctx.drawImage(v,0,0,160,120);
      let frame=tctx.getImageData(0,0,160,120);

      if(last){
        let diff=0;
        for(let i=0;i<frame.data.length;i+=40){
          diff+=Math.abs(frame.data[i]-last.data[i]);
        }

        if(diff>5000){
          document.getElementById("motionState").innerText="MOTION!";
          log("Motion detected");
          startAlarm();
        }else{
          document.getElementById("motionState").innerText="idle";
        }
      }

      last=frame;
      ctx.putImageData(frame,0,0);
    }

    requestAnimationFrame(loop);
  }

  loop();
}

/* ALARM LOOP */
function startAlarm(){
  if(alarmRunning) return;
  alarmRunning=true;

  document.body.classList.add("alarm");

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="sawtooth";
  osc.frequency.value=880;
  gain.gain.value=0.25;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  function loop(){
    if(!alarmRunning) return;
    osc.frequency.value=800+Math.random()*300;
    setTimeout(loop,200);
  }
  loop();

  window.stopAlarm=function(){
    alarmRunning=false;
    osc.stop();
    document.body.classList.remove("alarm");
  }
}

/* LOCKDOWN */
function lockdown(){
  document.body.classList.add("lockdown");
  banner("LOCKDOWN MODE");
  log("SYSTEM LOCKED");
  startAlarm();
}
</script>

</body>
</html>
