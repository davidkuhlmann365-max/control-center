<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V9 INTERCOM OS</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
    display:flex;
    height:100vh;
}

#sidebar{
    width:220px;
    background:#111826;
    padding:10px;
    display:flex;
    flex-direction:column;
}

#sidebar button{
    margin:5px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1e2a3a;
    color:white;
    cursor:pointer;
}

#main{ flex:1; padding:15px; }

.view{ display:none; }
.view.active{ display:block; }

.panel{
    background:#121a26;
    padding:15px;
    border-radius:12px;
    max-width:700px;
}

video{
    width:100%;
    border-radius:12px;
    background:black;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="sidebar">
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('camera')">📹 Camera</button>
<button onclick="show('intercom')">🎙️ Intercom</button>
</div>

<div id="main">

<!-- HOME -->
<div id="home" class="view active">
<div class="panel">
<h2>🏠 INTERCOM READY</h2>
<p>Status: Standby</p>
</div>
</div>

<!-- CAMERA -->
<div id="camera" class="view">
<div class="panel">
<h3>📹 LIVE VIEW</h3>
<video id="cam" autoplay playsinline></video>
</div>
</div>

<!-- INTERCOM -->
<div id="intercom" class="view">
<div class="panel">
<h3>🔔 DOORBELL SYSTEM</h3>

<button onclick="ringBell()">🔔 RING</button>

<div id="callBox" style="display:none;">
    <p>📞 Incoming Call...</p>

    <button onclick="acceptCall()">🟢 ACCEPT</button>
    <button onclick="declineCall()">🔴 DECLINE</button>
</div>

<p id="state">READY</p>

</div>
</div>

</div>

<script>

let stream = null;
let callActive = false;
let callTimeout = null;

function show(id){
document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* 🔔 RING = CALL START */
async function ringBell(){

document.getElementById("callBox").style.display = "block";
document.getElementById("state").innerText = "CALLING...";

callTimeout = setTimeout(()=>{
    endCall();
}, 20000); // 20 sec auto timeout

}

/* 🟢 ACCEPT CALL */
async function acceptCall(){

callActive = true;

document.getElementById("state").innerText = "CALL ACTIVE";

/* Kamera starten */
stream = await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
});

document.getElementById("cam").srcObject = stream;

document.getElementById("camera").classList.add("active");

document.getElementById("callBox").style.display = "none";

clearTimeout(callTimeout);

}

/* 🔴 DECLINE */
function declineCall(){
endCall();
}

/* ❌ END */
function endCall(){

callActive = false;

document.getElementById("state").innerText = "CALL ENDED";
document.getElementById("callBox").style.display = "none";

if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
}

}

</script>

</body>
</html>
