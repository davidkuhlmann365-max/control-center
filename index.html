<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Alarmzentrale</title>
  <style>
    body { font-family: Arial; background: #0b0f14; color: white; text-align: center; }
    .box { margin: 20px; padding: 20px; background: #141c2b; border-radius: 12px; }
    .alarm { background: red !important; }
    button { padding: 15px; margin: 10px; border: none; border-radius: 10px; cursor: pointer; }
    .red { background: #ff2b2b; color: white; }
    .green { background: #2ecc71; color: white; }
  </style>
</head>
<body>

  <h1>🚨 Alarmzentrale</h1>

  <div class="box" id="panel">
    <h3 id="status">Status: AUS</h3>
    <button class="red" onclick="startAlarm()">ALARM START</button>
    <button class="green" onclick="stopAlarm()">STOP</button>
  </div>

  <script>
    let alarmActive = false;
    let alarmAudio = new Audio('deutscher-bahnhofsgong.mp3'); // Deine echte MP3-Datei
    alarmAudio.loop = true;

    function startAlarm() {
      if (alarmActive) return; // Verhindert mehrfaches Starten
      alarmActive = true;

      alarmAudio.currentTime = 0;
      alarmAudio.play().catch(err => {
        console.log("Audio blockiert:", err);
        alert("Bitte einmal klicken, um Audio zu aktivieren.");
      });

      document.getElementById("status").innerText = "Status: ALARM!";
      document.getElementById("panel").classList.add("alarm");
    }

    function stopAlarm() {
      alarmActive = false;

      alarmAudio.pause();
      alarmAudio.currentTime = 0;

      document.getElementById("status").innerText = "Status: AUS";
      document.getElementById("panel").classList.remove("alarm");
    }
  </script>

</body>
</html>
