<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V5 Security Tablet</title>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Security V5">

<style>
body{
    margin:0;
    background:#000814;
    color:#00ff99;
    font-family: monospace;
    overflow:hidden;
}

#login, #app{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#app{display:none; padding:10px;}

.panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
}

.box{
    border:1px solid #00ff99;
    padding:10px;
}

.danger{color:red; font-weight:bold;}

button{
    padding:8px;
    margin:3px;
}

.log{
    height:120px;
    overflow:auto;
    font-size:12px;
    border:1px solid #00ff99;
    padding:5px;
}

video{
    width:100%;
    border:1px solid #00ff99;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}
</style>
</head>

<body>

<div id="login">
    <h2>🔐 V5 SECURITY LOGIN</h2>
    <input id="pin" type="password" placeholder="PIN">
    <button onclick="login()">ENTER</button>
</div>

<div id="app">

    <h2>📟 SECURITY TABLET V5</h2>

    <div class="panel">

        <div class="box">
            <h3>STATUS</h3>
            <p id="status">DISARMED</p>
            <button onclick="arm()">ARM</button>
            <button onclick="disarm()">DISARM</button>
        </div>

        <div class="box">
            <h3>AI MOTION SENSOR</h3>
            <video id="cam" autoplay playsinline></video>
            <canvas id="scan" style="display:none;"></canvas>
            <p id="motion">No motion</p>
        </div>

        <div class="box">
            <h3>CAMERA GRID</h3>
            <div class="grid" id="grid"></div>
        </div>

        <div class="box">
            <h3>LOG</h3>
            <div class="log" id="log"></div>
        </div>

    </div>
</div>

<audio id="alarm" loop>
<source src="alarm.mp3">
</audio>

<script>
const PIN="1234";
let armed=false;
let alarm=false;
let lastFrame=null;
let broadcast = new BroadcastChannel("SECURITY_PANEL");

function log(t){
    const l=document.getElementById("log");
    l.innerHTML+="["+new Date().toLocaleTimeString()+"] "+t+"<br>";
    l.scrollTop=l.scrollHeight;
}

function login(){
    if(document.getElementById("pin").value===PIN){
        document.getElementById("login").style.display="none";
        document.getElementById("app").style.display="flex";
        startCamera();
        setupNotifications();
        setupRemote();
        log("LOGIN OK");
    }
}

function setStatus(t){
    document.getElementById("status").innerHTML=t;
}

// FULLSCREEN (iPad App Mode)
function goFullscreen(){
    let el=document.documentElement;
    if(el.requestFullscreen){
        el.requestFullscreen();
    }
}

// ARM / DISARM
function arm(){
    armed=true;
    setStatus("ARMED");
    log("SYSTEM ARMED");
    broadcast.postMessage({type:"arm"});
    goFullscreen();
}

function disarm(){
    armed=false;
    stopAlarm();
    setStatus("DISARMED");
    log("SYSTEM DISARMED");
    broadcast.postMessage({type:"disarm"});
}

// CAMERA MAIN
function startCamera(){
    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        document.getElementById("cam").srcObject=stream;
        startMotionDetection();
        startGridCameras();
    });
}

// 🧠 "AI" MOTION DETECTION (Frame Diff)
function startMotionDetection(){
    const video=document.getElementById("cam");
    const canvas=document.getElementById("scan");
    const ctx=canvas.getContext("2d");

    setInterval(()=>{
        if(video.readyState<2 || !armed) return;

        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;

        ctx.drawImage(video,0,0);
        let frame=ctx.getImageData(0,0,canvas.width,canvas.height);

        if(lastFrame){
            let diff=0;
            for(let i=0;i<frame.data.length;i+=40){
                diff+=Math.abs(frame.data[i]-lastFrame.data[i]);
            }

            document.getElementById("motion").innerText="Motion: "+diff;

            if(diff>15000){
                trigger("MOTION DETECTED");
            }
        }

        lastFrame=frame;
    },300);
}

// MULTI CAMERA GRID
async function startGridCameras(){
    const grid=document.getElementById("grid");
    const devices=await navigator.mediaDevices.enumerateDevices();
    const cams=devices.filter(d=>d.kind==="videoinput");

    cams.slice(0,4).forEach(async (cam,i)=>{
        let stream=await navigator.mediaDevices.getUserMedia({
            video:{deviceId:cam.deviceId}
        });

        let v=document.createElement("video");
        v.autoplay=true;
        v.playsInline=true;
        v.srcObject=stream;
        grid.appendChild(v);
    });
}

// ALARM
function trigger(reason){
    if(alarm || !armed) return;

    alarm=true;
    setStatus("<span class='danger'>ALARM ACTIVE</span>");
    log("ALARM: "+reason);

    document.getElementById("alarm").play();

    notify("SECURITY ALERT", reason);
    broadcast.postMessage({type:"alarm", reason});
}

function stopAlarm(){
    alarm=false;
    document.getElementById("alarm").pause();
}

// 🔔 PUSH NOTIFICATIONS
function setupNotifications(){
    if("Notification" in window){
        Notification.requestPermission();
    }
}

function notify(title,msg){
    if(Notification.permission==="granted"){
        new Notification(title,{body:msg});
    }
}

// 🌐 REMOTE CONTROL SYNC
function setupRemote(){
    broadcast.onmessage=(e)=>{
        if(e.data.type==="arm") setStatus("ARMED (REMOTE)");
        if(e.data.type==="disarm") setStatus("DISARMED (REMOTE)");
        if(e.data.type==="alarm") trigger(e.data.reason+" (REMOTE)");
    };

    setInterval(()=>{
        localStorage.setItem("sync",JSON.stringify({armed,alarm,t:Date.now()}));
    },1000);
}

// iPad keep awake (if supported)
if(navigator.wakeLock){
    navigator.wakeLock.request("screen");
}
</script>

</body>
</html>
