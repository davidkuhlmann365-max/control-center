<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 SMART DOORBELL</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
    text-align:center;
}

.panel{
    max-width:700px;
    margin:20px auto;
    padding:15px;
    background:#121a26;
    border-radius:12px;
}

video{
    width:100%;
    border-radius:12px;
    background:black;
}

button{
    padding:12px;
    margin:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#state{
    font-size:18px;
    margin:10px;
    font-weight:bold;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}
</style>
</head>

<body>

<div class="panel">
<h2>📡 SMART DOORBELL V4</h2>

<p id="state">READY</p>

<video id="cam" autoplay playsinline></video>

<br>

<button onclick="ringBell()">🔔 RING</button>
<button onclick="startSystem('caller')">📱 START AS CALLER</button>
<button onclick="startSystem('receiver')">💻 START AS RECEIVER</button>

</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>

/* =========================
   🔥 FIREBASE SETUP
========================= */

const firebaseConfig = {
    databaseURL: "YOUR_FIREBASE_URL"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let pc;
let stream;
let roomId = "door-v4";

/* =========================
   📡 START SYSTEM
========================= */

async function startSystem(role){

    stream = await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
    });

    document.getElementById("cam").srcObject = stream;

    pc = new RTCPeerConnection({
        iceServers:[
            { urls:"stun:stun.l.google.com:19302" }
        ]
    });

    stream.getTracks().forEach(track=>{
        pc.addTrack(track, stream);
    });

    pc.ontrack = (e)=>{
        document.getElementById("cam").srcObject =
            e.streams[0];
    };

    pc.onicecandidate = (e)=>{
        if(e.candidate){
            db.ref(roomId + "/candidates").push(
                JSON.stringify(e.candidate)
            );
        }
    };

    if(role === "caller"){
        createOffer();
    } else {
        listenOffer();
    }

    document.getElementById("state").innerText =
        "📶 CONNECTED AS " + role;
}

/* =========================
   📤 OFFER
========================= */

async function createOffer(){

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    db.ref(roomId + "/offer").set(
        JSON.stringify(offer)
    );

    listenAnswer();
}

/* =========================
   📥 ANSWER
========================= */

function listenOffer(){

    db.ref(roomId + "/offer").on("value", async snap=>{

        if(!snap.val()) return;

        const offer = JSON.parse(snap.val());

        await pc.setRemoteDescription(offer);

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        db.ref(roomId + "/answer").set(
            JSON.stringify(answer)
        );
    });
}

/* =========================
   📥 ANSWER LISTENER
========================= */

function listenAnswer(){

    db.ref(roomId + "/answer").on("value", async snap=>{

        if(!snap.val()) return;

        const answer = JSON.parse(snap.val());

        await pc.setRemoteDescription(answer);
    });
}

/* =========================
   🔔 DOORBELL
========================= */

function ringBell(){

    db.ref(roomId + "/ring").set(true);

    document.getElementById("state").innerText =
        "🔔 RINGING...";

    navigator.vibrate?.([200,100,200]);
}

/* =========================
   📡 AUTO RING LISTENER
========================= */

db.ref(roomId + "/ring").on("value", snap=>{

    if(snap.val() === true){

        document.getElementById("state").innerText =
            "📶 INCOMING CALL";

    }
});

</script>

</body>
</html>
