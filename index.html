<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2 Pro Max Security System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
}

/* TOP STATUS */
#top{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#111826;
    font-size:13px;
}

/* GRID */
.container{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    padding:10px;
}

/* CARD */
.card{
    background:#121a26;
    border-radius:12px;
    padding:12px;
}

/* BUTTON */
button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1e2a3a;
    color:white;
}

/* ZONES */
.zone{
    padding:8px;
    margin:5px 0;
    border-radius:8px;
    background:#0f1622;
}

/* LOG */
#log{
    height:160px;
    overflow:auto;
    font-size:12px;
    background:#0c121c;
    padding:8px;
    border-radius:8px;
}

/* DOTS */
.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
}
.green{background:lime;}
.yellow{background:orange;}
.red{background:red;}

/* FLASH */
@keyframes flash{
    0%{background:#0b0f14;}
    50%{background:#3b0000;}
    100%{background:#0b0f14;}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="top">
    <div>THREAT: <span id="threat">GREEN</span></div>
    <div>STATE: <span id="state">DISARMED</span></div>
    <div>CARD: <span id="card">NONE</span></div>
</div>

<div class="container">

<!-- KEYCARD -->
<div class="card">
    <h3>🪪 KEYCARD</h3>
    <button onclick="cardIn('ADMIN')">Insert ADMIN</button>
    <button onclick="cardIn('USER')">Insert USER</button>
    <button onclick="cardOut()">Remove Card</button>
</div>

<!-- CONTROL -->
<div class="card">
    <h3>🔐 CONTROL</h3>
    <button onclick="arm()">ARM SYSTEM</button>
    <button onclick="disarm()">DISARM (ADMIN ONLY)</button>
</div>

<!-- ZONES -->
<div class="card">
    <h3>🗺️ ZONES</h3>

    <div class="zone">Zone A - Entrance <button onclick="trigger('ZONE A')">Trigger</button></div>
    <div class="zone">Zone B - Living Room <button onclick="trigger('ZONE B')">Trigger</button></div>
    <div class="zone">Zone C - Basement <button onclick="trigger('ZONE C')">Trigger</button></div>
</div>

<!-- LOG -->
<div class="card">
    <h3>📜 EVENT LOG</h3>
    <div id="log"></div>
</div>

</div>

<script>

let state="DISARMED";
let card=null;
let threat="GREEN";
let siren=null;

/* LOG */
function log(msg,color="white"){
    let t=new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML=
    `<span style="color:${color}">[${t}] ${msg}</span><br>`+
    document.getElementById("log").innerHTML;
}

/* UI */
function update(){

    document.getElementById("state").innerText=state;
    document.getElementById("threat").innerText=threat;
    document.getElementById("card").innerText=card?card:"NONE";

    if(threat==="RED"){
        document.body.style.animation="flash 0.2s infinite";
    }else{
        document.body.style.animation="";
    }
}

/* CARD */
function cardIn(type){
    card=type;
    log("Card inserted: "+type,"deepskyblue");
    update();
}

function cardOut(){
    log("Card removed","orange");

    if(state==="ARMED"){
        triggerAlarm("CARD REMOVED");
    }

    card=null;
    update();
}

/* ARM */
function arm(){
    if(!card){
        log("ARM FAILED","red");
        return;
    }

    state="ARMED";
    threat="GREEN";
    log("SYSTEM ARMED","lime");
    update();
}

/* DISARM */
function disarm(){

    if(card!=="ADMIN"){
        log("DISARM DENIED","red");
        triggerAlarm("UNAUTHORIZED DISARM");
        return;
    }

    state="DISARMED";
    threat="GREEN";
    stopAlarm();
    log("SYSTEM DISARMED","lime");
    update();
}

/* ZONES */
function trigger(zone){

    if(state!=="ARMED"){
        log(zone+" ignored","gray");
        return;
    }

    log("BREACH: "+zone,"orange");
    threat="RED";

    update();
    triggerAlarm(zone);
}

/* ALARM ENGINE */
function triggerAlarm(reason){

    log("ALARM: "+reason,"red");

    let freq=500;

    if(siren) clearInterval(siren);

    siren=setInterval(()=>{

        const ctx=new (window.AudioContext||webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type="sawtooth";
        osc.frequency.value=freq;
        gain.gain.value=0.12;

        osc.start();
        osc.stop(ctx.currentTime+0.25);

        freq=(freq===500)?1300:500;

    },280);
}

/* STOP */
function stopAlarm(){
    if(siren){
        clearInterval(siren);
        siren=null;
    }

    threat="GREEN";
    update();
}

update();

</script>

</body>
</html>
