<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V13 Security Panel</title>

<style>
body{
margin:0;
background:#05070c;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00ffcc;
}

.panel{
width:780px;
background:#0b0f14;
border:2px solid #1affc6;
box-shadow:0 0 25px #00ffcc33;
display:flex;
flex-direction:column;
}

.top{display:flex;}

.floor{
width:50%;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px;
background:#070a10;
}

.room{
border:1px solid #1affc6;
padding:12px;
text-align:center;
cursor:pointer;
background:#0d141d;
font-size:12px;
}

.open{background:#ff3b3b66;}
.trouble{background:#ffcc0040;}

.cam{
width:50%;
background:#000;
border-left:1px solid #1affc6;
display:flex;
flex-direction:column;
}

video{
width:100%;
height:240px;
object-fit:cover;
}

.snap{
height:120px;
overflow:auto;
font-size:11px;
color:#00ff88;
padding:6px;
border-top:1px solid #1affc6;
}

.bottom{
border-top:1px solid #1affc6;
padding:10px;
background:#000;
}

.screen{
min-height:60px;
color:#00ffcc;
white-space:pre-line;
}

button{
margin:3px;
padding:6px;
font-family:monospace;
background:#111;
color:#00ffcc;
border:1px solid #1affc6;
cursor:pointer;
}
</style>
</head>

<body>

<div class="panel">

<div class="top">

<div class="floor">
<div class="room" onclick="trigger('door')">DOOR</div>
<div class="room" onclick="trigger('window')">WINDOW</div>
<div class="room" onclick="trigger('motion')">MOTION</div>
<div class="room" onclick="trigger('smoke')">SMOKE</div>
<div class="room" onclick="doorbell()">🚪 BELL</div>
</div>

<div class="cam">
<video id="video" autoplay></video>
<div class="snap" id="snap">SNAP LOG</div>
</div>

</div>

<div class="bottom">
<div class="screen" id="screen">SYSTEM READY</div>

<button onclick="silenceAlarm()">🔇 SILENCE</button>
<button onclick="resetSystem()">🔄 RESET</button>

<div id="log"></div>
</div>

</div>

<script>

/* ---------------- CAMERA ---------------- */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>document.getElementById("video").srcObject=s)
.catch(()=>{});

/* ---------------- SYSTEM ---------------- */
let zones={
door:{state:"CLOSED",battery:100,online:true},
window:{state:"CLOSED",battery:100,online:true},
motion:{state:"CLOSED",battery:100,online:true},
smoke:{state:"CLOSED",battery:100,online:true}
};

let alarmActive=false;
let alarmLock=false;
let sirenSilenced=false;

/* ---------------- AUDIO ---------------- */
let ctx,osc,loop;

function initAudio(){
if(!ctx)ctx=new AudioContext();
}

function stopSound(){
clearInterval(loop);
if(osc){try{osc.stop();}catch(e){}}
}

/* ---------------- ALARM ---------------- */
function startAlarm(){

if(alarmLock) return;
alarmLock=true;
alarmActive=true;

stopSound();
initAudio();

osc=ctx.createOscillator();
let g=ctx.createGain();

osc.connect(g);g.connect(ctx.destination);

osc.type="square";
g.gain.value=0.05;
osc.start();

let up=false;

loop=setInterval(()=>{
if(sirenSilenced) return;

osc.frequency.value=up?900:400;
up=!up;
},220);

screen("🚨 ALARM ACTIVE");
log("ALARM TRIGGERED");
notify("ALARM","Intrusion detected");
}

/* ---------------- TROUBLE ---------------- */
function startTrouble(){
screen("⚠ SYSTEM TROUBLE");
log("TROUBLE EVENT");
}

/* ---------------- UI ---------------- */
function screen(t){
document.getElementById("screen").innerText=t;
}

function log(m){
document.getElementById("log").innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;
}

/* ---------------- SNAP ---------------- */
function snap(t){
document.getElementById("snap").innerText+=`\n${t}`;
}

/* ---------------- DOORBELL ---------------- */
function doorbell(){
screen("🚪 DOORBELL");
log("DOORBELL");
beep();
notify("DOORBELL","Visitor at door");
snap("DOORBELL EVENT");
}

/* ---------------- BEEP ---------------- */
function beep(){
initAudio();
let o=ctx.createOscillator();
let g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
o.frequency.value=880;
g.gain.value=0.03;
o.start();
setTimeout(()=>o.stop(),200);
}

/* ---------------- TRIGGER ---------------- */
function trigger(z){
zones[z].state="OPEN";
log(z+" OPEN");
startAlarm();
}

/* ---------------- SILENCE ---------------- */
function silenceAlarm(){
stopSound();
sirenSilenced=true;
screen("🔇 SILENCED");
log("SIREN SILENCED");
}

/* ---------------- RESET ---------------- */
function resetSystem(){

alarmActive=false;
alarmLock=false;
sirenSilenced=false;

stopSound();

for(let z in zones){
zones[z].state="CLOSED";
zones[z].online=true;
zones[z].battery=100;
}

screen("SYSTEM READY");
log("SYSTEM RESET");

notify("SYSTEM","Reset complete");
}

/* ---------------- PUSH ---------------- */
function notify(title,msg){
if(Notification.permission==="granted"){
new Notification(title,{body:msg});
}
}

if(Notification.permission!=="granted"){
Notification.requestPermission();
}

</script>

</body>
</html>
