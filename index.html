<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Security System PRO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f14;
    color: #00ff9d;
}

/* TOP BAR */
#topbar {
    background: #111;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
}

/* LAYOUT */
#container {
    display: flex;
    height: 100vh;
}

/* LEFT PANEL */
#left {
    width: 320px;
    background: #0f1720;
    padding: 10px;
}

button {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    background: #111;
    border: 1px solid #00ff9d;
    color: #00ff9d;
    cursor: pointer;
}

button:hover {
    background: #00ff9d;
    color: black;
}

/* ZONES */
.zone {
    margin-top: 10px;
    padding: 8px;
    background: #000;
    border: 1px solid #222;
    font-size: 12px;
}

/* LOG */
#log {
    margin-top: 10px;
    height: 200px;
    overflow-y: auto;
    font-size: 12px;
    background: black;
    padding: 5px;
}

/* KEYPAD */
#keypad {
    position: absolute;
    right: 20px;
    top: 80px;
    background: #111;
    padding: 10px;
    border: 1px solid #00ff9d;
}

.keyrow button {
    width: 60px;
}
</style>
</head>

<body>

<div id="topbar">
    <div>SECURITY PANEL PRO</div>
    <div id="status">STATUS: ARMED</div>
</div>

<div id="container">

<div id="left">
    <h3>Controls</h3>

    <button onclick="setMode('HOME')">HOME MODE</button>
    <button onclick="setMode('AWAY')">AWAY MODE</button>
    <button onclick="setMode('DISARMED')">DISARM</button>

    <h3>Manual Triggers</h3>
    <button onclick="startAlarm('door')">Door Alarm</button>
    <button onclick="startAlarm('motion')">Motion Alarm</button>
    <button onclick="startAlarm('smoke')">Smoke Alarm</button>

    <button onclick="enablePanic()">PANIC</button>
    <button onclick="stopAlarm()">STOP</button>

    <h3>ZONES</h3>
    <div class="zone" id="doorZone">Door: OK</div>
    <div class="zone" id="windowZone">Window: OK</div>
    <div class="zone" id="motionZone">Motion: OK</div>

    <div id="log"></div>
</div>

</div>

<!-- KEYPAD -->
<div id="keypad">
    <div id="display">----</div>

    <div class="keyrow">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
    </div>
    <div class="keyrow">
        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
    </div>
    <div class="keyrow">
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
    </div>
    <div class="keyrow">
        <button onclick="clearPin()">C</button>
        <button onclick="press(0)">0</button>
        <button onclick="submitPin()">OK</button>
    </div>
</div>

<script>
let audioCtx;
let alarmActive = false;
let panic = false;

let alarmToken = 0;

let mode = "ARMED";

let pin = "";
const correctPin = "1234";
let attempts = 0;
let locked = true;

// ---------------- LOG ----------------
function log(msg) {
    const el = document.getElementById("log");
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
}

// ---------------- STATUS ----------------
function setMode(m) {
    mode = m;
    document.getElementById("status").innerText = "STATUS: " + m;
    log("Mode: " + m);
}

// ---------------- AUDIO ----------------
function beep(f=3000,d=0.15) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.frequency.value = f;
    o.type = "square";

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    setTimeout(()=>o.stop(), d*1000);
}

// ---------------- FLASH ----------------
function flash() {
    document.body.style.background = "rgba(255,0,0,0.4)";
    setTimeout(()=>document.body.style.background="#0b0f14",120);
}

// ---------------- PATTERNS ----------------
function smoke(t) {
    if (!alarmActive || t !== alarmToken) return;

    beep(); setTimeout(()=>beep(),250); setTimeout(()=>beep(),500);
    flash();

    setTimeout(()=>{
        if (alarmActive && t === alarmToken)
            setTimeout(()=>smoke(t), panic ? 1000 : 2000);
    },800);
}

function door(t) {
    if (!alarmActive || t !== alarmToken) return;

    beep(1800,0.2);
    flash();

    setTimeout(()=>{
        if (alarmActive && t === alarmToken)
            setTimeout(()=>door(t), panic ? 600 : 1500);
    },500);
}

function motion(t) {
    if (!alarmActive || t !== alarmToken) return;

    beep(2800,0.1);
    setTimeout(()=>beep(2800,0.1),200);
    flash();

    setTimeout(()=>{
        if (alarmActive && t === alarmToken)
            setTimeout(()=>motion(t), panic ? 800 : 1800);
    },600);
}

// ---------------- START ALARM ----------------
function startAlarm(type) {
    if (alarmActive) return;

    audioCtx = new AudioContext();
    alarmActive = true;
    alarmToken++;

    log("ALARM: " + type);

    if (type==="smoke") smoke(alarmToken);
    if (type==="door") door(alarmToken);
    if (type==="motion") motion(alarmToken);
}

// ---------------- PANIC ----------------
function enablePanic() {
    panic = true;
    log("PANIC MODE");

    let i=0;
    function strobe(){
        if (!alarmActive || !panic) return;
        document.body.style.background="rgba(255,0,0,0.8)";
        setTimeout(()=>document.body.style.background="#0b0f14",60);

        if(i++<30) setTimeout(strobe,100);
    }
    strobe();
}

// ---------------- STOP ----------------
function stopAlarm() {
    alarmActive = false;
    panic = false;
    alarmToken++;

    if (audioCtx) {
        audioCtx.close();
        audioCtx=null;
    }

    log("ALARM STOPPED");
}

// ---------------- PIN ----------------
function press(n){
    if (locked) return;
    if(pin.length<4) pin+=n;
    document.getElementById("display").innerText=pin.padEnd(4,"-");
}

function clearPin(){
    pin="";
    document.getElementById("display").innerText="----";
}

function submitPin(){
    if(pin===correctPin){
        locked=false;
        attempts=0;
        setMode("DISARMED");
        log("PIN OK");
    } else {
        attempts++;
        log("WRONG PIN");

        if(attempts>=3){
            log("LOCKDOWN");
            startAlarm("door");
        }
    }
    clearPin();
}
</script>

</body>
</html>
