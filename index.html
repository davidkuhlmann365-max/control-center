<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Panel V8 Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0b0f14;
    color: #00ff9c;
    min-height: 100vh;
    overflow-x: hidden;
}

/* TOPBAR */
.topbar {
    background: #111826;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 1px;
    border-bottom: 2px solid #00ff9c;
    font-size: 14px;
}

/* LOGIN */
.login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0b0f14;
    padding: 20px;
}

.pin-display {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 20px;
}

.pin-box {
    display: grid;
    grid-template-columns: repeat(3, minmax(60px, 1fr));
    gap: 10px;
    width: min(300px, 90vw);
}

button.key {
    aspect-ratio: 1 / 1;
    font-size: 18px;
    background: #111826;
    color: #00ff9c;
    border: 1px solid #00ff9c;
    border-radius: 10px;
}

button.key:active {
    background: #00ff9c;
    color: #000;
}

.wide {
    grid-column: span 3;
}

/* DASHBOARD */
.dashboard {
    display: none;
    padding: 10px;
    max-width: 1000px;
    margin: auto;
}

/* GRID LAYOUT (RESPONSIVE) */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
}

/* PANEL */
.panel {
    background: #111826;
    border: 1px solid #00ff9c;
    border-radius: 10px;
    padding: 10px;
}

/* TEXT */
h3 {
    font-size: 14px;
    margin-bottom: 8px;
}

/* STATUS */
.status {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
}

/* ZONES */
.zone {
    padding: 6px;
    border: 1px solid #00ff9c;
    margin-top: 5px;
    font-size: 12px;
}

/* BUTTON */
.btn {
    padding: 8px;
    background: #00ff9c;
    color: #000;
    border: none;
    margin-top: 8px;
    width: 100%;
    font-weight: bold;
    border-radius: 6px;
    font-size: 13px;
}

/* VIDEO */
video {
    width: 100%;
    border-radius: 10px;
    max-height: 200px;
    object-fit: cover;
}

/* ALARM EFFECT */
.alarm {
    animation: flash 0.5s infinite;
}

@keyframes flash {
    0% { background: #0b0f14; }
    50% { background: red; color: white; }
    100% { background: #0b0f14; }
}

</style>
</head>

<body>

<div class="topbar">SECURITY PANEL V8 PRO - RESPONSIVE</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="pin-display" id="pinDisplay">----</div>

    <div class="pin-box">
        <button class="key" onclick="press(1)">1</button>
        <button class="key" onclick="press(2)">2</button>
        <button class="key" onclick="press(3)">3</button>
        <button class="key" onclick="press(4)">4</button>
        <button class="key" onclick="press(5)">5</button>
        <button class="key" onclick="press(6)">6</button>
        <button class="key" onclick="press(7)">7</button>
        <button class="key" onclick="press(8)">8</button>
        <button class="key" onclick="press(9)">9</button>
        <button class="key wide" onclick="press(0)">0</button>
        <button class="key wide" onclick="checkPin()">ENTER</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<div class="grid">

    <div class="panel">
        <h3>STATUS</h3>
        <div class="status">
            <div>System: ARMED</div>
            <div>Battery: OK</div>
        </div>
    </div>

    <div class="panel">
        <h3>CAMERA</h3>
        <video id="video" autoplay></video>
        <button class="btn" onclick="startCamera()">Start Camera</button>
    </div>

    <div class="panel">
        <h3>ZONES</h3>
        <div class="zone">Door: OK</div>
        <div class="zone">Window: OK</div>
        <div class="zone">Motion: OK</div>
    </div>

    <div class="panel">
        <h3>ALARM</h3>
        <button class="btn" onclick="triggerAlarm()">TRIGGER</button>
        <button class="btn" onclick="resetAlarm()">RESET</button>
    </div>

</div>

</div>

<!-- AUDIO -->
<audio id="smokeAlarm" loop>
  <source src="salamisound-7927385-rauchmelder-30-sekunden-10-x.mp3" type="audio/mpeg">
</audio>

<script>
let pin = "";
const correctPin = "1234";
let alarmActive = false;

function press(n){
    if(pin.length < 4){
        pin += n;
        document.getElementById("pinDisplay").innerText = pin.padEnd(4,"-");
    }
}

function checkPin(){
    if(pin === correctPin){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        if(navigator.vibrate) navigator.vibrate(200);
    } else {
        alert("Falscher PIN!");
        pin = "";
        document.getElementById("pinDisplay").innerText = "----";
    }
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        document.getElementById("video").srcObject = stream;
    })
    .catch(() => alert("Kamera nicht erlaubt"));
}

function triggerAlarm(){
    if(alarmActive) return;
    alarmActive = true;
    document.body.classList.add("alarm");
    document.getElementById("smokeAlarm").play();
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
}

function resetAlarm(){
    alarmActive = false;
    document.body.classList.remove("alarm");
    let a = document.getElementById("smokeAlarm");
    a.pause();
    a.currentTime = 0;
}
</script>

</body>
</html>
