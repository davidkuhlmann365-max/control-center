<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fix Test</title>
<style>
body{background:black;color:lime;font-family:Arial;}
#panel{display:none;}
</style>
</head>
<body>

<div id="login">
  <h2>LOGIN</h2>
  <input id="pin" type="password">
  <button onclick="checkPin()">UNLOCK</button>
</div>

<div id="panel">
  <h1>OK - SYSTEM LÄUFT</h1>
</div>

<script>
function checkPin(){
  const pin=document.getElementById("pin").value;

  if(pin==="1234"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
  } else {
    alert("FALSCH");
  }
}
</script>

</body>
</html>
