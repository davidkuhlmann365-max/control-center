<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Security Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b10;
      color: #00ff9c;
    }

    /* Login */
    #login {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    input {
      padding: 10px;
      font-size: 18px;
      text-align: center;
    }

    /* Panel */
    #panel {
      display: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: #111;
      border-bottom: 2px solid #00ff9c;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .box {
      background: #111a24;
      padding: 10px;
      border-radius: 10px;
    }

    button {
      background: #00ff9c;
      border: none;
      padding: 8px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .red { background: #ff3b3b; color: white; }

    #log {
      height: 150px;
      overflow: auto;
      font-size: 12px;
      background: #000;
      padding: 5px;
    }

    /* Hidden Exit Box */
    #exitBox {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      border: 2px solid #00ff9c;
      padding: 20px;
      z-index: 10000;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login">
  <h2>ENTER PIN</h2>
  <input type="password" id="pin" placeholder="****">
  <button onclick="checkPin()">UNLOCK</button>
</div>

<!-- Main Panel -->
<div id="panel">
  <header>
    <div>🟢 SECURITY SYSTEM</div>
    <div>
      <button onclick="toggleFS()">FULLSCREEN</button>
      <button class="red" onclick="triggerAlarm()">ALERT</button>
    </div>
  </header>

  <div class="container">
    <div class="box">
      <h3>ZONES</h3>
      <button onclick="toggle('Door')">Door</button>
      <button onclick="toggle('Window')">Window</button>
      <button onclick="toggle('Motion')">Motion</button>
    </div>
    <div class="box">
      <h3>STATUS</h3>
      <p id="status">DISARMED</p>
      <button onclick="arm()">ARM</button>
      <button onclick="disarm()" class="red">DISARM</button>
    </div>
    <div class="box" style="grid-column: span 2;">
      <h3>📜 LOG</h3>
      <div id="log"></div>
    </div>
  </div>
</div>

<!-- Exit Box (Hidden PIN) -->
<div id="exitBox">
  <h3>EXIT CODE</h3>
  <input type="password" id="exitPin" placeholder="PIN">
  <button onclick="checkExit()">EXIT</button>
</div>

<script>
  let armed = false;
  let zones = {};
  
  function log(msg){
    const l = document.getElementById("log");
    l.innerHTML = "[" + new Date().toLocaleTimeString() + "] " + msg + "<br>" + l.innerHTML;
  }

  // Login Logic
  function checkPin(){
    const pin = document.getElementById("pin").value;
    if(pin === "1234"){
      document.getElementById("login").style.display = "none";
      document.getElementById("panel").style.display = "block";
      log("SYSTEM UNLOCKED");
    } else {
      alert("WRONG PIN");
    }
  }

  // Arm/Disarm
  function arm(){
    armed = true;
    document.getElementById("status").innerText = "ARMED";
    log("SYSTEM ARMED");
  }

  function disarm(){
    armed = false;
    document.getElementById("status").innerText = "DISARMED";
    log("SYSTEM DISARMED");
  }

  // Toggle Zones
  function toggle(z){
    zones[z] = !zones[z];
    log(z + " " + (zones[z] ? "TRIGGERED" : "NORMAL"));
    if(armed && zones[z]) alarm();
  }

  // Alarm Sound
  function alarm(){
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let i = 0;
    const interval = setInterval(() => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.value = 200 + (i * 50);
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
      i++;
      if(i > 10) clearInterval(interval);
    }, 150);
  }

  // Manual Alert
  function triggerAlarm(){
    log("MANUAL ALERT");
    alarm();
  }

  // Fullscreen Toggle
  function toggleFS(){
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      el.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  // Exit Logic (PIN)
  let exitClicks = 0;
  document.addEventListener("keydown", (e) => {
    // Beispiel: Escape-Taste zum Öffnen
    if (e.key === "Escape") {
      document.getElementById("exitBox").style.display = "block";
    }
  });

  function checkExit(){
    const pin = document.getElementById("exitPin").value;
    if(pin === "0000"){
      if(document.fullscreenElement){
        document.exitFullscreen();
      }
      log("EXITED SYSTEM");
      document.getElementById("exitBox").style.display = "none";
    } else {
      alert("WRONG EXIT CODE");
    }
  }

  // Initial log
  log("System started");
</script>

</body>
</html>
