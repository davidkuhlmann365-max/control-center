<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8 INTERCOM OS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0f14;
    color:white;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
}

#sidebar{
    width:220px;
    background:#111826;
    padding:10px;
    display:flex;
    flex-direction:column;
}

#sidebar button{
    margin:4px 0;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1d2938;
    color:white;
    cursor:pointer;
}

#sidebar button:hover{
    background:#2a3b52;
}

#main{
    flex:1;
    padding:15px;
    overflow:auto;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.panel{
    background:#121a26;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    max-width:800px;
}

h2,h3{
    margin-bottom:10px;
}

button{
    padding:10px 14px;
    margin:4px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}

video{
    width:100%;
    border-radius:12px;
    border:2px solid #1e2a3a;
}

.status-green{
    color:#00ff88;
}

.status-red{
    color:#ff4444;
}

.status-yellow{
    color:#ffaa00;
}

#clock{
    font-size:24px;
    font-weight:bold;
}

@media(max-width:700px){

body{
    flex-direction:column;
}

#sidebar{
    width:100%;
    flex-direction:row;
    overflow:auto;
}

#sidebar button{
    flex:1;
    font-size:12px;
}
}
</style>
</head>

<body>

<div id="sidebar">

<button onclick="showView('home')">🏠 Home</button>
<button onclick="showView('camera')">📹 Camera</button>
<button onclick="showView('intercom')">🎙️ Intercom</button>
<button onclick="showView('door')">🚪 Door</button>
<button onclick="showView('alarm')">🚨 Alarm</button>

</div>

<div id="main">

<div id="home" class="view active">

<div class="panel">
<h2>🛡️ V8 INTERCOM OS</h2>

<p id="clock">00:00:00</p>

<br>

<p id="systemStatus" class="status-green">
SYSTEM READY
</p>

<p id="batteryStatus">
🔋 Battery: 100%
</p>

<p id="cameraStatus">
📹 Camera: OFFLINE
</p>

<p id="doorStatusHome">
🚪 Door: LOCKED
</p>

</div>

</div>

<div id="camera" class="view">

<div class="panel">

<h3>📹 DOORBELL CAMERA</h3>

<video id="cam" autoplay playsinline muted></video>

<br><br>

<button onclick="startCamera()">
START CAMERA
</button>

<button onclick="stopCamera()">
STOP CAMERA
</button>

</div>

</div>

<div id="intercom" class="view">

<div class="panel">

<h3>🎙️ INTERCOM</h3>

<button
onmousedown="startTalk()"
onmouseup="stopTalk()"
ontouchstart="startTalk()"
ontouchend="stopTalk()">

HOLD TO TALK

</button>

<button onclick="ringBell()">
🔔 RING BELL
</button>

<p id="talkStatus">
IDLE
</p>

<p id="bellStatus">
READY
</p>

</div>

</div>

<div id="door" class="view">

<div class="panel">

<h3>🚪 DOOR CONTROL</h3>

<input id="pin" type="password" placeholder="PIN">

<button onclick="unlockDoor()">
UNLOCK
</button>

<button onclick="lockDoor()">
LOCK
</button>

<p id="doorState">
LOCKED 🔴
</p>

</div>

</div>

<div id="alarm" class="view">

<div class="panel">

<h3>🚨 SECURITY ALARM</h3>

<button onclick="triggerAlarm()">
TRIGGER ALARM
</button>

<button onclick="silenceAlarm()">
SILENCE
</button>

<p id="alarmStatus">
STANDBY
</p>

</div>

</div>

</div>

<script>

let stream=null;
let recorder=null;
let chunks=[];
let alarmRunning=false;
let doorLocked=true;

function showView(id){

document.querySelectorAll(".view").forEach(v=>{
v.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

function updateClock(){

const now=new Date();

document.getElementById("clock").innerText=
now.toLocaleTimeString();

}

setInterval(updateClock,1000);
updateClock();

async function startCamera(){

try{

stream=await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("cam").srcObject=stream;

document.getElementById("cameraStatus").innerText=
"📹 Camera: ONLINE";

}
catch(e){

alert("Camera access denied");

}

}

function stopCamera(){

if(stream){

stream.getTracks().forEach(track=>{
track.stop();
});

stream=null;

document.getElementById("cameraStatus").innerText=
"📹 Camera: OFFLINE";

}

}

function startTalk(){

if(!stream){
alert("Start camera first");
return;
}

chunks=[];

recorder=new MediaRecorder(stream);

recorder.ondataavailable=e=>{
chunks.push(e.data);
};

recorder.start();

document.getElementById("talkStatus").innerText=
"LIVE TALKING...";

}

function stopTalk(){

if(!recorder) return;

recorder.onstop=()=>{

const blob=new Blob(chunks,{
type:"audio/webm"
});

const url=URL.createObjectURL(blob);

new Audio(url).play();

};

recorder.stop();

document.getElementById("talkStatus").innerText=
"IDLE";

}

function ringBell(){

document.getElementById("bellStatus").innerText=
"🔔 RINGING";

const ctx=new(window.AudioContext||window.webkitAudioContext)();

const osc=ctx.createOscillator();

osc.type="sine";
osc.frequency.value=900;

osc.connect(ctx.destination);

osc.start();

setTimeout(()=>{

osc.stop();

document.getElementById("bellStatus").innerText=
"READY";

},800);

}

function unlockDoor(){

const pin=document.getElementById("pin").value;

if(pin==="1234"){

doorLocked=false;

document.getElementById("doorState").innerText=
"UNLOCKED 🟢";

document.getElementById("doorStatusHome").innerText=
"🚪 Door: UNLOCKED";

}
else{

alert("Wrong PIN");

}

}

function lockDoor(){

doorLocked=true;

document.getElementById("doorState").innerText=
"LOCKED 🔴";

document.getElementById("doorStatusHome").innerText=
"🚪 Door: LOCKED";

}

let alarmInterval;

function triggerAlarm(){

if(alarmRunning) return;

alarmRunning=true;

document.getElementById("alarmStatus").innerText=
"🚨 ALARM ACTIVE";

document.getElementById("systemStatus").innerText=
"🚨 SECURITY BREACH";

alarmInterval=setInterval(()=>{

const ctx=new(window.AudioContext||window.webkitAudioContext)();

const osc=ctx.createOscillator();

osc.frequency.value=1200;

osc.connect(ctx.destination);

osc.start();

setTimeout(()=>{
osc.stop();
},200);

},1000);

}

function silenceAlarm(){

alarmRunning=false;

clearInterval(alarmInterval);

document.getElementById("alarmStatus").innerText=
"STANDBY";

document.getElementById("systemStatus").innerText=
"SYSTEM READY";

}

setInterval(()=>{

let level=Math.floor(Math.random()*20)+80;

document.getElementById("batteryStatus").innerText=
"🔋 Battery: "+level+"%";

},15000);

</script>

</body>
</html>
