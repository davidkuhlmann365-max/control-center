<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V4 Security Control Center</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
}

/* TOP BAR */
#topbar{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#111826;
    font-size:13px;
}

/* NAV */
#nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
    background:#0f1622;
}

button.nav{
    background:#1e2a3a;
    border:none;
    padding:8px 12px;
    color:white;
    border-radius:6px;
}

/* PAGES */
.page{
    display:none;
    padding:10px;
}

.active{
    display:block;
}

/* CARD */
.card{
    background:#121a26;
    padding:12px;
    margin:10px auto;
    border-radius:10px;
    max-width:500px;
}

/* BUTTON */
button{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1e2a3a;
    color:white;
}

/* LOG */
#log{
    height:150px;
    overflow:auto;
    font-size:12px;
    background:#0c121c;
    padding:8px;
    border-radius:8px;
}

/* FLASH */
@keyframes flash{
    0%{background:#0b0f14;}
    50%{background:#3b0000;}
    100%{background:#0b0f14;}
}
</style>
</head>

<body>

<!-- TOP STATUS -->
<div id="topbar">
    <div>STATE: <span id="state">DISARMED</span></div>
    <div>THREAT: <span id="threat">GREEN</span></div>
    <div>CARD: <span id="card">NONE</span></div>
</div>

<!-- NAV -->
<div id="nav">
    <button class="nav" onclick="show('home')">🏠</button>
    <button class="nav" onclick="show('security')">🛡️</button>
    <button class="nav" onclick="show('audio')">🔊</button>
    <button class="nav" onclick="show('dashboard')">📊</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
    <div class="card">
        <h2>CONTROL CENTER</h2>
        <p>All Systems Online</p>
    </div>
</div>

<!-- SECURITY -->
<div id="security" class="page">

    <div class="card">
        <h3>🪪 KEYCARD</h3>
        <button onclick="card('ADMIN')">Insert ADMIN</button>
        <button onclick="card('USER')">Insert USER</button>
        <button onclick="removeCard()">Remove</button>
    </div>

    <div class="card">
        <h3>🔐 CONTROL</h3>
        <button onclick="arm()">ARM</button>
        <button onclick="disarm()">DISARM</button>
    </div>

    <div class="card">
        <h3>📡 SENSORS</h3>
        <button onclick="trigger('DOOR')">Door</button>
        <button onclick="trigger('MOTION')">Motion</button>
        <button onclick="trigger('SMOKE')">Smoke</button>
    </div>

</div>

<!-- AUDIO -->
<div id="audio" class="page">

    <div class="card">
        <h3>🔊 TEST TONE</h3>
        <button onclick="tone(440)">440 Hz</button>
        <button onclick="tone(1000)">1000 Hz</button>
        <button onclick="stopTone()">Stop</button>
    </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">

    <div class="card">
        <h3>📊 SYSTEM LOG</h3>
        <div id="log"></div>
    </div>

</div>

<script>

/* STATE */
let state="DISARMED";
let cardType=null;

/* NAV */
function show(p){
    document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
    document.getElementById(p).classList.add("active");
}

/* LOG */
function log(msg){
    let t=new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML=
    `[${t}] ${msg}<br>`+
    document.getElementById("log").innerHTML;
}

/* UI */
function update(){
    document.getElementById("state").innerText=state;
    document.getElementById("card").innerText=cardType||"NONE";

    if(state==="ALARM"){
        document.getElementById("threat").innerText="RED";
        document.body.style.animation="flash 0.2s infinite";
    }else{
        document.getElementById("threat").innerText="GREEN";
        document.body.style.animation="";
    }
}

/* CARD */
function card(type){
    cardType=type;
    log("Card inserted: "+type);
    update();
}

function removeCard(){
    log("Card removed");
    cardType=null;
    update();
}

/* ARM */
function arm(){
    if(!cardType){
        log("ARM FAILED");
        return;
    }
    state="ARMED";
    log("SYSTEM ARMED");
    update();
}

/* DISARM */
function disarm(){
    if(cardType!=="ADMIN"){
        log("DISARM DENIED");
        triggerAlarm("UNAUTHORIZED");
        return;
    }
    state="DISARMED";
    stopAlarm();
    log("SYSTEM DISARMED");
    update();
}

/* SENSOR */
function trigger(type){
    if(state!=="ARMED"){
        log(type+" ignored");
        return;
    }
    state="ALARM";
    log("ALARM: "+type);
    triggerAlarm(type);
    update();
}

/* ALARM */
let siren=null;

function triggerAlarm(reason){
    let freq=500;

    if(siren) clearInterval(siren);

    siren=setInterval(()=>{

        const ctx=new (window.AudioContext||webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type="sawtooth";
        osc.frequency.value=freq;
        gain.gain.value=0.1;

        osc.start();
        osc.stop(ctx.currentTime+0.2);

        freq=(freq===500)?1200:500;

    },300);
}

/* STOP */
function stopAlarm(){
    if(siren){
        clearInterval(siren);
        siren=null;
    }
    state="DISARMED";
    update();
}

/* AUDIO */
let ctx, osc;

function tone(f){
    ctx=new AudioContext();
    osc=ctx.createOscillator();
    osc.frequency.value=f;
    osc.connect(ctx.destination);
    osc.start();
}

function stopTone(){
    if(osc) osc.stop();
}

update();

</script>

</body>
</html>
