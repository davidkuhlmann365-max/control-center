<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V10+ Security System</title>

<style>
body{
margin:0;
background:#05070c;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00ffcc;
}

.panel{
width:720px;
background:#0b0f14;
border:2px solid #1affc6;
box-shadow:0 0 25px #00ffcc33;
display:flex;
flex-direction:column;
}

.top{
display:flex;
}

.floor{
width:50%;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px;
background:#070a10;
}

.room{
border:1px solid #1affc6;
padding:14px;
text-align:center;
cursor:pointer;
background:#0d141d;
}

.ok{background:#0d141d;}
.open{background:#ff3b3b66;}
.offline{background:#66666655;}
.trouble{background:#ffcc0040;}

.cam{
width:50%;
background:#000;
border-left:1px solid #1affc6;
display:flex;
flex-direction:column;
align-items:center;
}

video{
width:100%;
height:240px;
object-fit:cover;
}

.snap{
width:100%;
height:120px;
overflow:auto;
font-size:11px;
color:#00ff88;
padding:6px;
border-top:1px solid #1affc6;
}

.bottom{
border-top:1px solid #1affc6;
padding:10px;
background:#000;
}

.screen{
color:#00ff88;
min-height:70px;
white-space:pre-line;
}

.log{
height:120px;
overflow:auto;
font-size:11px;
margin-top:5px;
}
</style>
</head>

<body>

<div class="panel">

<div class="top">

<div class="floor">
<div class="room" id="door" onclick="trigger('door')">DOOR</div>
<div class="room" id="window" onclick="trigger('window')">WINDOW</div>
<div class="room" id="motion" onclick="trigger('motion')">MOTION</div>
<div class="room" id="smoke" onclick="trigger('smoke')">SMOKE</div>
</div>

<div class="cam">
<video id="video" autoplay></video>
<div class="snap" id="snap">SNAP LOG</div>
</div>

</div>

<div class="bottom">
<div class="screen" id="screen">SYSTEM READY</div>
<div class="log" id="log"></div>
</div>

</div>

<script>

/* ---------------- CAMERA ---------------- */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>document.getElementById("video").srcObject=s);

/* ---------------- ZONES ---------------- */
let zones={
door:{state:"CLOSED",battery:100,signal:100,online:true},
window:{state:"CLOSED",battery:100,signal:100,online:true},
motion:{state:"CLOSED",battery:100,signal:100,online:true},
smoke:{state:"CLOSED",battery:100,signal:100,online:true}
};

/* ---------------- STATES ---------------- */
let alarm=false;
let troubleLevel=0;

/* ---------------- AUDIO ---------------- */
let ctx,osc,loop;

function initAudio(){
if(!ctx)ctx=new AudioContext();
}

function beep(f=800,t=120,v=0.03){
initAudio();
let o=ctx.createOscillator();
let g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
o.type="square";
o.frequency.value=f;
g.gain.value=v;
o.start();
setTimeout(()=>o.stop(),t);
}

function stopSound(){
clearInterval(loop);
if(osc){try{osc.stop();}catch(e){}}
}

/* ---------------- SOUND SYSTEM ---------------- */
function alarmSound(){
stopSound();
initAudio();
osc=ctx.createOscillator();
let g=ctx.createGain();
osc.connect(g);g.connect(ctx.destination);
osc.type="square";
g.gain.value=0.05;
osc.start();

let up=false;
loop=setInterval(()=>{
osc.frequency.value=up?900:400;
up=!up;
},220);
}

function troubleSound(level){

stopSound();

if(level<=2){
loop=setInterval(()=>beep(700,120,0.02),45000);
}

else if(level===3){
loop=setInterval(()=>beep(750,80,0.03),8000);
}

else if(level>=4){
initAudio();
osc=ctx.createOscillator();
let g=ctx.createGain();
osc.connect(g);g.connect(ctx.destination);
osc.type="square";
g.gain.value=0.04;
osc.start();

let up=false;
loop=setInterval(()=>{
osc.frequency.value=up?1000:600;
up=!up;
},150);
}
}

/* ---------------- SNAPSHOT ---------------- */
function snap(e){
let t=new Date().toLocaleTimeString();
document.getElementById("snap").innerText+=`\n[${t}] ${e}`;
}

/* ---------------- UI ---------------- */
function screen(t){document.getElementById("screen").innerText=t;}

function log(m){
let t=new Date().toLocaleTimeString();
let el=document.createElement("div");
el.innerText=`[${t}] ${m}`;
document.getElementById("log").appendChild(el);
}

/* ---------------- FLOOR ---------------- */
function updateFloor(){
for(let z in zones){
let el=document.getElementById(z);
let r=zones[z];
el.className="room ok";

if(r.state==="OPEN")el.classList.add("open");
if(!r.online)el.classList.add("offline");
if(r.battery<20)el.classList.add("trouble");

el.innerText=`${z.toUpperCase()}\n${r.state}`;
}
}

/* ---------------- TROUBLE ENGINE ---------------- */
function evaluateTrouble(){

let score=0;

for(let z in zones){
zones[z].battery-=Math.random()*0.2;

if(zones[z].battery<20)score+=1;
if(zones[z].battery<10)score+=2;

if(!zones[z].online)score+=2;

if(Math.random()<0.01)zones[z].online=false;
if(Math.random()<0.005)zones[z].state="OPEN";
}

let newLevel=0;

if(score===0)newLevel=0;
else if(score<=2)newLevel=1;
else if(score<=4)newLevel=2;
else if(score<=6)newLevel=3;
else newLevel=4;

if(newLevel!==troubleLevel){
troubleLevel=newLevel;
log("TROUBLE LEVEL → "+newLevel);

if(newLevel===0){
screen("SYSTEM READY");
stopSound();
}

else{
screen("TROUBLE LEVEL "+newLevel);
troubleSound(newLevel);
snap("TROUBLE EVENT");
}
}
}

/* ---------------- SYSTEM CHECK ---------------- */
function checkSystem(){

alarm=false;

for(let z in zones){
if(zones[z].state==="OPEN")alarm=true;
}

if(alarm){
screen("ALARM ACTIVE");
alarmSound();
snap("ALARM TRIGGERED");
}
}

/* ---------------- USER ACTION ---------------- */
function trigger(z){
zones[z].state="OPEN";
log(z+" TRIGGERED");
snap(z+" MANUAL");
checkSystem();
}

/* ---------------- LOOP ---------------- */
setInterval(()=>{
evaluateTrouble();
checkSystem();
updateFloor();
},3000);

updateFloor();

</script>

</body>
</html>
