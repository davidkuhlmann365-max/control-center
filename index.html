<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V10 Keycard Security System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
    text-align:center;
}

/* DASHBOARD */
#dash{
    padding:15px;
}

/* PANELS */
.panel{
    background:#121a26;
    margin:10px auto;
    padding:12px;
    border-radius:12px;
    width:92%;
    max-width:420px;
}

/* BUTTONS */
button{
    padding:12px;
    margin:5px;
    width:90%;
    border:none;
    border-radius:8px;
    background:#1e2a3a;
    color:white;
    font-size:15px;
}

/* LED */
.led{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin:0 5px;
}
.green{background:lime;}
.yellow{background:orange;}
.red{background:red;}

/* LOG */
#log{
    text-align:left;
    font-size:12px;
    height:140px;
    overflow:auto;
    background:#0f1622;
    padding:10px;
    border-radius:10px;
}

/* FLASH */
@keyframes flash{
    0%{background:#0b0f14;}
    50%{background:red;}
    100%{background:#0b0f14;}
}
</style>
</head>

<body>

<div id="dash">

<h2>V10 KEYCARD SECURITY SYSTEM</h2>

<!-- STATUS -->
<div class="panel">
    <h3>SYSTEM STATUS</h3>
    <div>
        ARM: <span class="led red" id="ledArm"></span>
        ALERT: <span class="led green" id="ledAlert"></span>
        KEYCARD: <span class="led red" id="ledCard"></span>
    </div>
</div>

<!-- KEYCARD -->
<div class="panel">
    <h3>KEYCARD SLOT</h3>

    <button onclick="insertCard('ADMIN-001')">🪪 Insert ADMIN Card</button>
    <button onclick="insertCard('USER-123')">🪪 Insert USER Card</button>
    <button onclick="removeCard()">⏏ Remove Card</button>
</div>

<!-- SENSORS -->
<div class="panel">
    <h3>SENSORS</h3>

    <button onclick="door()">🚪 Door Open</button>
    <button onclick="motion()">🧍 Motion</button>
    <button onclick="smoke()">🔥 Smoke</button>
</div>

<!-- CONTROL -->
<div class="panel">
    <h3>CONTROL</h3>

    <button onclick="armSystem()">🔒 ARM SYSTEM</button>
    <button onclick="disarmSystem()">🔓 DISARM SYSTEM</button>
</div>

<!-- LOG -->
<div class="panel">
    <h3>EVENT LOG</h3>
    <div id="log"></div>
</div>

</div>

<audio id="smokeAudio" src="smoke.mp3"></audio>

<script>

let armed=false;
let cardInserted=null;

let smokeAudio=document.getElementById("smokeAudio");
let sirenInterval=null;

/* LOG */
function log(msg){
    let t=new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML =
    `[${t}] ${msg}<br>` + document.getElementById("log").innerHTML;
}

/* LED */
function updateLED(){
    document.getElementById("ledArm").className="led "+(armed?"green":"red");
    document.getElementById("ledCard").className="led "+(cardInserted?"green":"red");
}

/* KEYCARD */
function insertCard(id){
    cardInserted=id;
    updateLED();
    log("Keycard inserted: "+id);

    if(id!=="ADMIN-001" && id!=="USER-123"){
        triggerAlarm("UNKNOWN CARD");
    }
}

function removeCard(){
    log("Keycard removed");

    if(armed){
        triggerAlarm("CARD REMOVED WHILE ARMED");
    }

    cardInserted=null;
    updateLED();
}

/* ARM / DISARM */
function armSystem(){
    if(!cardInserted){
        log("ARM FAILED - NO KEYCARD");
        triggerAlarm("NO KEYCARD");
        return;
    }

    armed=true;
    updateLED();
    document.body.style.background="#0b0f14";
    log("SYSTEM ARMED");
}

function disarmSystem(){
    if(cardInserted!=="ADMIN-001"){
        log("DISARM DENIED - ADMIN ONLY");
        triggerAlarm("UNAUTHORIZED DISARM");
        return;
    }

    armed=false;
    stopAlarm();
    updateLED();
    log("SYSTEM DISARMED");
}

/* SENSORS */
function door(){
    log("DOOR EVENT");
    if(armed) triggerAlarm("DOOR BREACH");
}

function motion(){
    log("MOTION EVENT");
    if(armed) triggerAlarm("MOTION DETECTED");
}

function smoke(){
    log("SMOKE EVENT");
    smokeAudio.loop=true;
    smokeAudio.play();

    if(armed) triggerAlarm("SMOKE DETECTED");
}

/* ALARM */
function triggerAlarm(reason){

    log("ALARM: "+reason);

    document.body.style.animation="flash 0.2s infinite";
    document.body.style.background="darkred";

    let freq=500;

    if(sirenInterval) clearInterval(sirenInterval);

    sirenInterval=setInterval(()=>{

        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type="sawtooth";
        osc.frequency.value=freq;
        gain.gain.value=0.12;

        osc.start();
        osc.stop(ctx.currentTime+0.25);

        freq=(freq===500)?1200:500;

    },300);
}

/* STOP */
function stopAlarm(){

    document.body.style.animation="";
    document.body.style.background="#0b0f14";

    smokeAudio.pause();
    smokeAudio.currentTime=0;

    if(sirenInterval){
        clearInterval(sirenInterval);
        sirenInterval=null;
    }
}

updateLED();

</script>

</body>
</html>
