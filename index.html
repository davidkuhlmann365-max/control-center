<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Tablet V6</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0f14;
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#1a2a3a,#05070a);
}

.box{
  background:#111824;
  padding:20px;
  border-radius:10px;
  width:300px;
  text-align:center;
}

#display{
  font-size:26px;
  letter-spacing:4px;
  background:black;
  padding:10px;
  margin:10px 0;
}

/* KEYPAD */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.keypad button{
  padding:12px;
  background:#1f6feb;
  border:none;
  color:white;
  border-radius:6px;
}

/* APP */
#app{
  display:none;
  height:100vh;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  background:#111824;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
  padding:10px;
  overflow:auto;
}

.card{
  background:#121a26;
  border-radius:10px;
  padding:10px;
}

/* CAM */
.camGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.cam{
  background:black;
  height:90px;
  border-radius:6px;
}

/* STATUS */
.green{color:#7ee787}
.yellow{color:orange}
.red{color:red}

/* ALARM */
.alarm{
  animation:flash .2s infinite;
}
@keyframes flash{
  0%{background:red}
  50%{background:black}
  100%{background:red}
}

.lockdown{
  filter:grayscale(1);
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    <h3>SECURITY PANEL</h3>

    <div id="display">----</div>

    <div class="keypad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button onclick="clearPin()">C</button>
      <button onclick="press(0)">0</button>
      <button onclick="submit()">OK</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<div id="app">

  <div class="topbar">
    <div id="state">🟢 SYSTEM READY</div>
  </div>

  <div class="grid">

    <div class="card">
      <h3>THREAT LEVEL</h3>
      <div id="threat">GREEN</div>
    </div>

    <div class="card">
      <h3>ZONES</h3>
      <div>Door: OK</div>
      <div>Motion: OK</div>
      <div>Window: OK</div>
    </div>

    <div class="card">
      <h3>CAMERAS</h3>
      <div class="camGrid">
        <video id="cam" autoplay muted playsinline></video>
        <canvas id="fake"></canvas>
        <canvas></canvas>
        <canvas></canvas>
      </div>
    </div>

    <div class="card">
      <h3>LOG</h3>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>

const PIN="1234";
let input="";
let attempts=0;
let audio;
let alarm=false;

let threat="GREEN";

/* AUDIO */
function initAudio(){
  audio=audio||new AudioContext();
  if(audio.state==="suspended") audio.resume();
}

/* KEYPAD */
function press(n){
  if(input.length<4) input+=n;
  update();
}

function clearPin(){
  input="";
  update();
}

function update(){
  document.getElementById("display").innerText=input.padEnd(4,"-");
}

function submit(){
  initAudio();

  if(input===PIN){
    start();
  }else{
    attempts++;
    input="";
    update();

    if(attempts>=3){
      lockdown();
    }else{
      alarmStart();
    }
  }
}

/* START */
function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  log("SYSTEM ARMED");
  camera();
}

/* LOG */
function log(msg){
  document.getElementById("log").innerHTML=
  `[${new Date().toLocaleTimeString()}] ${msg}<br>`+
  document.getElementById("log").innerHTML;
}

/* CAMERA */
async function camera(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById("cam").srcObject=s;
    log("CAM ONLINE");
    threat="GREEN";
  }catch(e){
    log("CAM OFFLINE");
    threat="RED";
    alarmStart();
  }
}

/* THREAT SYSTEM */
function setThreat(level){
  document.getElementById("threat").innerText=level;
}

/* ALARM (ANTI THEFT STYLE) */
function alarmStart(){
  if(alarm)return;
  alarm=true;

  document.body.classList.add("alarm");

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="sawtooth";
  gain.gain.value=0.2;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  let t=0;
  const loop=setInterval(()=>{
    if(!alarm){clearInterval(loop);return;}
    osc.frequency.value=500+Math.sin(t)*300;
    t+=0.3;
  },100);
}

/* LOCKDOWN */
function lockdown(){
  document.body.classList.add("lockdown");
  setThreat("CRITICAL");
  log("LOCKDOWN ACTIVE");
  alarmStart();
}

</script>

</body>
</html>
