<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 Security Panel</title>

<style>
body {
    margin: 0;
    background: #0a0f1a;
    color: #00ff99;
    font-family: monospace;
    overflow: hidden;
}

#screen {
    display: none;
    height: 100vh;
    padding: 20px;
}

#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

input {
    font-size: 24px;
    padding: 10px;
    text-align: center;
    width: 200px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}

.panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.box {
    border: 1px solid #00ff99;
    padding: 10px;
}

.danger {
    color: red;
    font-weight: bold;
}

.log {
    height: 150px;
    overflow-y: auto;
    border: 1px solid #00ff99;
    padding: 5px;
    font-size: 12px;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 10px;
}

.keypad button {
    font-size: 20px;
}

</style>
</head>

<body>

<div id="login">
    <h2>SECURITY PANEL LOGIN</h2>
    <input id="pin" type="password" placeholder="PIN">
    <button onclick="checkPin()">ENTER</button>
</div>

<div id="screen">

    <h2>🔐 V3 SECURITY PANEL</h2>

    <div class="panel">

        <div class="box">
            <h3>STATUS</h3>
            <p id="status">DISARMED</p>
            <button onclick="armSystem()">ARM SYSTEM</button>
            <button onclick="disarmSystem()">DISARM</button>
        </div>

        <div class="box">
            <h3>CAMERA</h3>
            <video id="cam" autoplay playsinline width="100%"></video>
        </div>

        <div class="box">
            <h3>KEYPAD DISARM</h3>
            <input id="code" type="password" readonly>
            <div class="keypad">
                <button onclick="addNum(1)">1</button>
                <button onclick="addNum(2)">2</button>
                <button onclick="addNum(3)">3</button>
                <button onclick="addNum(4)">4</button>
                <button onclick="addNum(5)">5</button>
                <button onclick="addNum(6)">6</button>
                <button onclick="addNum(7)">7</button>
                <button onclick="addNum(8)">8</button>
                <button onclick="addNum(9)">9</button>
                <button onclick="clearCode()">C</button>
                <button onclick="addNum(0)">0</button>
                <button onclick="submitCode()">OK</button>
            </div>
        </div>

        <div class="box">
            <h3>LOG</h3>
            <div class="log" id="log"></div>
        </div>

        <div class="box">
            <h3>BATTERY</h3>
            <p id="battery">100%</p>
            <p id="batteryWarn"></p>
        </div>

    </div>

</div>

<audio id="alarmSound" loop>
    <source src="alarm.mp3" type="audio/mpeg">
</audio>

<audio id="lowBatterySound" loop>
    <source src="lowbattery.mp3" type="audio/mpeg">
</audio>

<script>
const MASTER_PIN = "1234";
let armed = false;
let alarmActive = false;
let inputCode = "";
let battery = 100;

function log(msg){
    const l = document.getElementById("log");
    l.innerHTML += "["+new Date().toLocaleTimeString()+"] "+msg+"<br>";
    l.scrollTop = l.scrollHeight;
}

function checkPin(){
    let p = document.getElementById("pin").value;
    if(p === MASTER_PIN){
        document.getElementById("login").style.display = "none";
        document.getElementById("screen").style.display = "block";
        startCamera();
        log("Login success");
    } else {
        alert("Falscher PIN");
    }
}

function armSystem(){
    armed = true;
    document.getElementById("status").innerText = "ARMED";
    log("System armed");
}

function disarmSystem(){
    armed = false;
    stopAlarm();
    document.getElementById("status").innerText = "DISARMED";
    log("System disarmed");
}

function triggerAlarm(){
    if(!alarmActive){
        alarmActive = true;
        document.getElementById("status").innerHTML = "<span class='danger'>ALARM ACTIVE</span>";
        document.getElementById("alarmSound").play();
        log("ALARM TRIGGERED");
    }
}

function stopAlarm(){
    alarmActive = false;
    document.getElementById("alarmSound").pause();
    document.getElementById("alarmSound").currentTime = 0;
    log("Alarm stopped");
}

function addNum(n){
    inputCode += n;
    document.getElementById("code").value = inputCode;
}

function clearCode(){
    inputCode = "";
    document.getElementById("code").value = "";
}

function submitCode(){
    if(inputCode === MASTER_PIN){
        disarmSystem();
    } else {
        log("Wrong code attempt!");
        triggerAlarm();
    }
    clearCode();
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        document.getElementById("cam").srcObject = stream;
    });
}

// Simulated sensor trigger
setInterval(()=>{
    if(armed && Math.random() < 0.03){
        triggerAlarm();
    }
}, 3000);

// Battery drain system
setInterval(()=>{
    battery -= 0.2;
    if(battery < 0) battery = 0;

    document.getElementById("battery").innerText = battery.toFixed(1) + "%";

    if(battery < 20){
        document.getElementById("batteryWarn").innerText = "LOW BATTERY";
        document.getElementById("lowBatterySound").play();
    }

    if(battery <= 5){
        triggerAlarm();
    }
}, 2000);

// ESC = keypad forced open (like real panel behavior)
document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
        log("ESC pressed - keypad forced active");
    }
});
</script>

</body>
</html>
