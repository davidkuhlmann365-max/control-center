<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Security Dashboard</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #fff;
  }

  header {
    background: #111826;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    padding: 12px;
  }

  .card {
    background: #151d2b;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
  }

  .status {
    font-size: 14px;
    opacity: 0.8;
  }

  .alarm-on {
    background: #ff2b2b !important;
  }

  button {
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }

  .btn-alarm {
    background: #ff2b2b;
    color: white;
  }

  .btn-stop {
    background: #2ecc71;
    color: white;
  }

  .fullscreen {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

</style>
</head>

<body>

<header>🛡️ Security Control Panel</header>

<div class="grid">
  <div class="card" id="alarmCard">
    <h3>Alarmanlage</h3>
    <div class="status" id="status">Status: AUS</div>
    <button class="btn-alarm" onclick="startAlarm()">ALARM AUSLÖSEN</button>
    <button class="btn-stop" onclick="stopAlarm()">STOP</button>
  </div>

  <div class="card">
    <h3>Kameras</h3>
    <div class="status">LIVE (Demo)</div>
  </div>

  <div class="card">
    <h3>System</h3>
    <div class="status">OK</div>
  </div>
</div>

<script>
let audioCtx;
let alarmActive = false;
let interval;

// einfacher "BEEP"
function playBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  oscillator.type = "square";
  oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.2);
}

function startAlarm() {
  if (alarmActive) return;

  alarmActive = true;
  document.getElementById("status").innerText = "Status: ALARM!";
  document.getElementById("alarmCard").classList.add("alarm-on");

  // wiederholender Alarm (FIX)
  interval = setInterval(() => {
    playBeep();
  }, 300);
}

function stopAlarm() {
  alarmActive = false;

  document.getElementById("status").innerText = "Status: AUS";
  document.getElementById("alarmCard").classList.remove("alarm-on");

  clearInterval(interval);
}
</script>

</body>
</html>
