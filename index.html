<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOM CONTROL</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;

  background:
    radial-gradient(
      circle at center,
      #12313d 0%,
      #071118 55%,
      #02070a 100%
    );

  color: #d9faff;
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   LOGIN
   ========================= */

#lockScreen {
  width: min(420px, 90vw);
  padding: 30px;

  border: 1px solid #277b91;
  border-radius: 20px;

  background: rgba(7, 20, 28, 0.95);

  box-shadow:
    0 0 30px rgba(39, 123, 145, 0.25),
    inset 0 0 30px rgba(39, 123, 145, 0.05);

  text-align: center;

  transition:
    border-color 0.2s,
    box-shadow 0.2s;
}

#lockScreen.alarm {
  border-color: #ff3b3b;

  box-shadow:
    0 0 35px rgba(255, 50, 50, 0.55),
    inset 0 0 30px rgba(255, 50, 50, 0.12);

  animation: alarmPulse 0.8s infinite;
}

@keyframes alarmPulse {
  50% {
    box-shadow:
      0 0 55px rgba(255, 50, 50, 0.75),
      inset 0 0 40px rgba(255, 50, 50, 0.2);
  }
}

#lockScreen h1 {
  margin: 0 0 10px;

  font-size: 30px;
  letter-spacing: 0.12em;
}

.lockStatus {
  margin-bottom: 20px;

  color: #6b9aa6;
  font-family: monospace;
}

#alarmMessage {
  display: none;

  margin: -5px 0 18px;
  padding: 14px;

  border: 1px solid #ff3b3b;
  border-radius: 10px;

  background: rgba(120, 0, 0, 0.18);

  color: #ff5c5c;

  font-family: monospace;
  font-size: 14px;
  line-height: 1.5;

  animation: alarmText 0.8s infinite;
}

#lockScreen.alarm #alarmMessage {
  display: block;
}

@keyframes alarmText {
  50% {
    opacity: 0.55;
  }
}


/* =========================
   LOGIN FELDER
   ========================= */

.loginInput {
  width: 100%;
  padding: 15px;
  margin-bottom: 12px;

  border: 1px solid #286e80;
  border-radius: 10px;

  background: #030b10;
  color: #d9faff;

  font-size: 20px;
  text-align: center;

  outline: none;

  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

.loginInput:focus {
  border-color: #70ddf5;

  box-shadow:
    0 0 10px rgba(112, 221, 245, 0.15);
}

#pinInput {
  letter-spacing: 0.3em;
}


/* =========================
   UNLOCK
   ========================= */

#unlockButton {
  width: 100%;
  min-height: 55px;

  margin-top: 5px;
  padding: 15px;

  border: 1px solid #286e80;
  border-radius: 10px;

  background:
    linear-gradient(#102b37, #07151c);

  color: #d9faff;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;

  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.1s;
}

#unlockButton:hover {
  border-color: #70ddf5;

  box-shadow:
    0 0 15px rgba(70, 210, 240, 0.25);
}

#unlockButton:active {
  transform: scale(0.98);
}

#pinError {
  min-height: 20px;

  margin-top: 15px;

  color: #ff6b6b;
  font-family: monospace;
}


/* =========================
   HAUPTSEITE
   ========================= */

.panel {
  width: min(720px, 92vw);
  padding: 30px;

  border: 1px solid #277b91;
  border-radius: 20px;

  background: rgba(7, 20, 28, 0.95);

  box-shadow:
    0 0 30px rgba(39, 123, 145, 0.25),
    inset 0 0 30px rgba(39, 123, 145, 0.05);

  transition:
    box-shadow 0.2s,
    border-color 0.2s;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

h1 {
  margin: 0;

  font-size: clamp(26px, 5vw, 44px);
  letter-spacing: 0.15em;
}

.online {
  color: #67ff9b;

  font-size: 13px;
  letter-spacing: 0.12em;

  white-space: nowrap;
}


/* =========================
   SCREEN
   ========================= */

.screen {
  margin: 25px 0;
  padding: 22px;

  min-height: 115px;

  border: 1px solid #185266;
  border-radius: 12px;

  background: #030b10;

  font-family: monospace;

  box-shadow:
    inset 0 0 20px rgba(0, 180, 220, 0.08);
}

#message {
  display: block;

  font-size: 25px;
  letter-spacing: 0.08em;
}

#detail {
  margin-top: 10px;

  color: #6b9aa6;
  line-height: 1.5;
}


/* =========================
   BUTTONS
   ========================= */

.buttons {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;
}

.controlButton {
  min-height: 120px;

  border: 1px solid #286e80;
  border-radius: 15px;

  background:
    linear-gradient(#102b37, #07151c);

  color: #d9faff;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.12s;

  box-shadow:
    inset 0 0 20px rgba(39, 123, 145, 0.08);
}

.controlButton:hover {
  border-color: #70ddf5;

  box-shadow:
    0 0 15px rgba(70, 210, 240, 0.25),
    inset 0 0 20px rgba(39, 123, 145, 0.15);
}

.controlButton:active {
  transform: scale(0.97);
}

.controlButton span {
  display: block;

  margin-bottom: 8px;

  font-size: 42px;
}


/* =========================
   LAUTSTÄRKE
   ========================= */

.volume {
  display: flex;
  align-items: center;
  gap: 12px;

  margin-top: 22px;

  color: #6b9aa6;
}

.volume input {
  width: 100%;
  cursor: pointer;
}


/* =========================
   ABMELDEN
   ========================= */

.logout {
  width: 100%;
  min-height: 55px;

  margin-top: 22px;

  border: 1px solid #286e80;
  border-radius: 10px;

  background:
    linear-gradient(#102b37, #07151c);

  color: #d9faff;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    inset 0 0 15px rgba(39, 123, 145, 0.08);

  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.1s;
}

.logout:hover {
  border-color: #70ddf5;

  box-shadow:
    0 0 15px rgba(70, 210, 240, 0.25);
}

.logout:active {
  transform: scale(0.98);
}


/* =========================
   FOOTER
   ========================= */

.footer {
  margin-top: 18px;

  text-align: center;

  color: #456c76;

  font-size: 11px;
  letter-spacing: 0.08em;
}


/* =========================
   FLASH EFFECT
   ========================= */

.flash {
  animation: flash 0.25s ease;
}

@keyframes flash {

  50% {
    box-shadow:
      0 0 35px rgba(80, 220, 255, 0.45),
      inset 0 0 30px rgba(80, 220, 255, 0.15);
  }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .panel {
    padding: 20px;
  }

  .header {
    align-items: flex-start;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

  .controlButton {
    min-height: 90px;
  }

  #message {
    font-size: 20px;
  }
}


@media (max-width: 380px) {

  .panel {
    padding: 15px;
  }

  #lockScreen {
    padding: 20px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>


<body>


<!-- =========================
     LOGIN SCREEN
     ========================= -->

<div id="lockScreen">

  <h1>ROOM CONTROL</h1>

  <div class="lockStatus">
    🔒 ACCESS LOCKED
  </div>

  <div id="alarmMessage">
    ⚠ MANIPULATION DETECTED ⚠<br><br>
    Bitte geben Sie das richtige Passwort ein,
    um den Alarm zu deaktivieren.
  </div>

  <input
    id="usernameInput"
    class="loginInput"
    type="text"
    autocomplete="username"
    placeholder="USERNAME"
    spellcheck="false"
  >

  <input
    id="pinInput"
    class="loginInput"
    type="password"
    inputmode="numeric"
    maxlength="4"
    autocomplete="current-password"
    placeholder="PIN"
  >

  <button
    id="unlockButton"
    type="button"
  >
    UNLOCK
  </button>

  <div id="pinError"></div>

</div>


<!-- =========================
     ROOM CONTROL
     ========================= -->

<main
  class="panel"
  id="panel"
  style="display: none;"
>

  <div class="header">

    <h1>ROOM CONTROL</h1>

    <div class="online">
      ● ONLINE
    </div>

  </div>


  <section class="screen">

    <span id="message">
      SYSTEM READY
    </span>

    <div id="detail">
      Awaiting command...
    </div>

  </section>


  <section class="buttons">

    <button
      id="power"
      class="controlButton"
      type="button"
    >
      <span>⏻</span>
      POWER
    </button>


    <button
      id="plus"
      class="controlButton"
      type="button"
    >
      <span>＋</span>
      BIOHAZARD
    </button>


    <button
      id="minus"
      class="controlButton"
      type="button"
    >
      <span>−</span>
      ERROR
    </button>

  </section>


  <div class="volume">

    🔊

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8"
      aria-label="Lautstärke"
    >

  </div>


  <button
    id="logoutButton"
    class="logout"
    type="button"
  >
    🔒 ABMELDEN
  </button>


  <div class="footer">
    ROOM ACCESS CONTROL • LOCAL INTERFACE
  </div>

</main>


<!-- =========================
     AUDIO
     ========================= -->

<audio
  id="accessGranted"
  preload="auto"
  src="https://cdn.pixabay.com/download/audio/2026/05/15/audio_f1f7fd4449.mp3?filename=soundshelfstudio-ui-system-access-granted-534603.mp3"
></audio>


<audio
  id="biohazard"
  preload="auto"
  src="https://cdn.pixabay.com/download/audio/2026/06/02/audio_26933dce5c.mp3?filename=tithuh-warning-545568.mp3"
></audio>


<script>
"use strict";


/* =========================
   LOGIN DATEN
   ========================= */

const correctUsername = "admin";
const correctPIN = "7392";


/* =========================
   ELEMENTE
   ========================= */

const lockScreen =
  document.getElementById("lockScreen");

const usernameInput =
  document.getElementById("usernameInput");

const pinInput =
  document.getElementById("pinInput");

const unlockButton =
  document.getElementById("unlockButton");

const pinError =
  document.getElementById("pinError");

const alarmMessage =
  document.getElementById("alarmMessage");

const panel =
  document.getElementById("panel");

const accessGranted =
  document.getElementById("accessGranted");

const biohazard =
  document.getElementById("biohazard");

const volume =
  document.getElementById("volume");

const message =
  document.getElementById("message");

const detail =
  document.getElementById("detail");

const powerButton =
  document.getElementById("power");

const biohazardButton =
  document.getElementById("plus");

const errorButton =
  document.getElementById("minus");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================
   ALARM STATUS
   ========================= */

let manipulationAlarmActive = false;

let alarmInterval = null;


/* =========================
   AUDIO CONTEXT
   ========================= */

let audioContext = null;


/* =========================
   AUDIO CONTEXT
   ========================= */

function getAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) {
    return null;
  }

  if (!audioContext) {

    audioContext =
      new AudioContextClass();

  }

  if (
    audioContext.state === "suspended"
  ) {

    audioContext.resume().catch(() => {});

  }

  return audioContext;
}


/* =========================
   LAUTSTÄRKE
   ========================= */

function getVolume() {

  const value =
    Number(volume.value);

  if (
    Number.isFinite(value) &&
    value >= 0 &&
    value <= 1
  ) {
    return value;
  }

  return 0.8;
}


function updateAudioVolume() {

  const currentVolume =
    getVolume();

  accessGranted.volume =
    currentVolume;

  biohazard.volume =
    currentVolume;
}


/* =========================
   NORMALE AUDIO STOPPEN
   ========================= */

function stopAllAudio() {

  [
    accessGranted,
    biohazard
  ].forEach(sound => {

    try {

      sound.pause();
      sound.currentTime = 0;

    } catch (error) {

      console.warn(
        "Audio konnte nicht zurückgesetzt werden:",
        error
      );

    }

  });
}


/* =========================
   MANIPULATIONSALARM
   ========================= */

function playManipulationAlarmTone() {

  const ctx =
    getAudioContext();

  if (!ctx) {
    return;
  }

  const now =
    ctx.currentTime;

  const master =
    ctx.createGain();

  master.gain.value =
    getVolume() * 0.32;

  master.connect(
    ctx.destination
  );


  /*
   * Kurzer zweistufiger Alarmton.
   * Er wird regelmäßig wiederholt.
   */

  const frequencies = [
    880,
    660
  ];


  frequencies.forEach(
    (frequency, index) => {

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      const start =
        now + index * 0.18;

      const end =
        start + 0.14;


      oscillator.type =
        "square";

      oscillator.frequency.setValueAtTime(
        frequency,
        start
      );


      gain.gain.setValueAtTime(
        0.001,
        start
      );

      gain.gain.exponentialRampToValueAtTime(
        0.8,
        start + 0.01
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        end
      );


      oscillator.connect(gain);
      gain.connect(master);


      oscillator.start(start);
      oscillator.stop(end);

    }
  );
}


/* =========================
   ALARM STARTEN
   ========================= */

function startManipulationAlarm() {

  getAudioContext();


  manipulationAlarmActive =
    true;


  lockScreen.classList.add(
    "alarm"
  );


  pinError.textContent =
    "MANIPULATION ALARM AKTIV";


  usernameInput.value = "";
  pinInput.value = "";


  message.textContent =
    "MANIPULATION DETECTED";


  detail.textContent =
    "Bitte geben Sie das richtige Passwort ein, um den Alarm zu deaktivieren.";


  playManipulationAlarmTone();


  if (alarmInterval !== null) {
    clearInterval(alarmInterval);
  }


  alarmInterval =
    window.setInterval(
      () => {

        if (
          manipulationAlarmActive
        ) {

          playManipulationAlarmTone();

        }

      },
      900
    );


  pinInput.focus();
}


/* =========================
   ALARM STOPPEN
   ========================= */

function stopManipulationAlarm() {

  manipulationAlarmActive =
    false;


  if (alarmInterval !== null) {

    clearInterval(
      alarmInterval
    );

    alarmInterval =
      null;
  }


  lockScreen.classList.remove(
    "alarm"
  );


  pinError.textContent =
    "";


  usernameInput.value =
    "";

  pinInput.value =
    "";
}


/* =========================
   FEHLERTON
   ========================= */

function playErrorSound() {

  const ctx =
    getAudioContext();

  if (!ctx) {
    return;
  }

  const now =
    ctx.currentTime;

  const masterGain =
    ctx.createGain();

  masterGain.gain.value =
    getVolume() * 0.25;

  masterGain.connect(
    ctx.destination
  );


  const notes = [
    {
      frequency: 700,
      start: 0.00,
      duration: 0.10
    },

    {
      frequency: 700,
      start: 0.13,
      duration: 0.10
    },

    {
      frequency: 350,
      start: 0.26,
      duration: 0.22
    }
  ];


  notes.forEach(note => {

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    const start =
      now + note.start;

    const end =
      start + note.duration;


    oscillator.type =
      "square";

    oscillator.frequency.setValueAtTime(
      note.frequency,
      start
    );


    gain.gain.setValueAtTime(
      0.8,
      start
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      end
    );


    oscillator.connect(gain);
    gain.connect(masterGain);


    oscillator.start(start);
    oscillator.stop(end);

  });
}


/* =========================
   ABMELDETON
   ========================= */

function playLogoutSound() {

  const ctx =
    getAudioContext();

  if (!ctx) {
    return;
  }

  const now =
    ctx.currentTime;

  const masterGain =
    ctx.createGain();

  masterGain.gain.value =
    getVolume() * 0.22;

  masterGain.connect(
    ctx.destination
  );


  const notes = [
    {
      frequency: 880,
      start: 0.00,
      duration: 0.10
    },

    {
      frequency: 660,
      start: 0.13,
      duration: 0.10
    },

    {
      frequency: 440,
      start: 0.26,
      duration: 0.22
    }
  ];


  notes.forEach(note => {

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    const start =
      now + note.start;

    const end =
      start + note.duration;


    oscillator.type =
      "square";

    oscillator.frequency.setValueAtTime(
      note.frequency,
      start
    );


    gain.gain.setValueAtTime(
      0.8,
      start
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      end
    );


    oscillator.connect(gain);
    gain.connect(masterGain);


    oscillator.start(start);
    oscillator.stop(end);

  });
}


/* =========================
   PANEL FLASH
   ========================= */

function flashPanel() {

  panel.classList.remove(
    "flash"
  );

  void panel.offsetWidth;

  panel.classList.add(
    "flash"
  );
}


/* =========================
   NORMALES AUDIO
   ========================= */

async function playSound(
  sound,
  title,
  description
) {

  stopAllAudio();

  updateAudioVolume();


  message.textContent =
    title;

  detail.textContent =
    description;


  flashPanel();


  try {

    await sound.play();

  } catch (error) {

    console.warn(
      "Audio konnte nicht abgespielt werden:",
      error
    );

    detail.textContent =
      "Audio konnte nicht abgespielt werden.";
  }
}


/* =========================
   LOGIN
   ========================= */

function unlock() {

  getAudioContext();


  const username =
    usernameInput.value.trim();

  const pin =
    pinInput.value;


  /*
   * RICHTIGE DATEN
   */

  if (
    username === correctUsername &&
    pin === correctPIN
  ) {

    /*
     * Alarm sofort deaktivieren.
     */

    stopManipulationAlarm();


    /*
     * Login öffnen.
     */

    lockScreen.style.display =
      "none";

    panel.style.display =
      "block";


    updateAudioVolume();


    message.textContent =
      "ACCESS GRANTED";

    detail.textContent =
      "Authentication successful.";


    accessGranted.currentTime =
      0;


    accessGranted.play()
      .catch(error => {

        console.warn(
          "Access-Sound konnte nicht abgespielt werden:",
          error
        );

      });


    return;
  }


  /*
   * FALSCHE DATEN
   */

  pinError.textContent =
    "ACCESS DENIED";


  startManipulationAlarm();

}


/* =========================
   UNLOCK BUTTON
   ========================= */

unlockButton.addEventListener(
  "click",
  unlock
);


/* =========================
   ENTER IM PIN
   ========================= */

pinInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      unlock();

    }

  }
);


/* =========================
   ENTER IM USERNAME
   ========================= */

usernameInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      pinInput.focus();

    }

  }
);


/* =========================
   POWER
   ========================= */

powerButton.addEventListener(
  "click",
  () => {

    getAudioContext();

    playSound(
      accessGranted,
      "ACCESS GRANTED",
      "Door control command accepted."
    );

  }
);


/* =========================
   BIOHAZARD
   ========================= */

biohazardButton.addEventListener(
  "click",
  async () => {

    getAudioContext();


    await playSound(
      biohazard,
      "WARNING",
      "WARNING: Biological hazard detected."
    );


    window.setTimeout(
      () => {

        try {

          biohazard.pause();

          biohazard.currentTime =
            0;

        } catch (error) {

          console.warn(
            "Biohazard-Audio konnte nicht gestoppt werden:",
            error
          );

        }

      },
      3000
    );

  }
);


/* =========================
   ERROR BUTTON
   ========================= */

errorButton.addEventListener(
  "click",
  () => {

    getAudioContext();

    stopAllAudio();

    playErrorSound();


    message.textContent =
      "ACCESS DENIED";

    detail.textContent =
      "Invalid control command.";


    flashPanel();

  }
);


/* =========================
   ABMELDEN
   ========================= */

logoutButton.addEventListener(
  "click",
  () => {

    getAudioContext();

    stopAllAudio();

    playLogoutSound();


    panel.style.display =
      "none";

    lockScreen.style.display =
      "block";


    usernameInput.value =
      "";

    pinInput.value =
      "";

    pinError.textContent =
      "";


    message.textContent =
      "SYSTEM READY";

    detail.textContent =
      "Awaiting command...";


    window.setTimeout(
      () => {

        usernameInput.focus();

      },
      50
    );

  }
);


/* =========================
   LAUTSTÄRKE
   ========================= */

volume.addEventListener(
  "input",
  updateAudioVolume
);


/* =========================
   AUDIO FEHLER
   ========================= */

accessGranted.addEventListener(
  "error",
  () => {

    console.warn(
      "Access-Granted-Audiodatei konnte nicht geladen werden."
    );

  }
);


biohazard.addEventListener(
  "error",
  () => {

    console.warn(
      "Biohazard-Audiodatei konnte nicht geladen werden."
    );

  }
);


/* =========================
   START
   ========================= */

updateAudioVolume();

usernameInput.focus();

</script>

</body>
</html>
