<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SECURITY SYSTEM V3</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:#00ff9d;
}

/* TOP */
#top {
    background:#111;
    padding:10px;
    display:flex;
    justify-content:space-between;
}

/* MAIN */
#wrap {
    display:flex;
    height:100vh;
}

#left {
    width:340px;
    background:#0f1720;
    padding:10px;
}

button {
    width:100%;
    margin:5px 0;
    padding:10px;
    background:#111;
    border:1px solid #00ff9d;
    color:#00ff9d;
    cursor:pointer;
}

button:hover {
    background:#00ff9d;
    color:#000;
}

.zone {
    background:#000;
    padding:6px;
    margin-top:6px;
    font-size:12px;
    border:1px solid #222;
}

#log {
    margin-top:10px;
    height:220px;
    overflow:auto;
    font-size:12px;
    background:#000;
    padding:5px;
}
</style>
</head>

<body>

<div id="top">
    <div>SECURITY SYSTEM V3</div>
    <div id="status">DISARMED</div>
</div>

<div id="wrap">

<div id="left">

<h3>MODE</h3>
<button onclick="setMode('HOME')">HOME</button>
<button onclick="setMode('AWAY')">AWAY</button>
<button onclick="setMode('NIGHT')">NIGHT</button>
<button onclick="setMode('DISARMED')">DISARM</button>

<h3>ALARM TEST</h3>
<button onclick="trigger('door')">Door</button>
<button onclick="trigger('motion')">Motion</button>
<button onclick="trigger('smoke')">Smoke</button>

<button onclick="panicMode()">PANIC</button>
<button onclick="stopAll()">STOP</button>

<h3>ZONES</h3>
<div class="zone" id="z1">Door: OK</div>
<div class="zone" id="z2">Window: OK</div>
<div class="zone" id="z3">Motion: OK</div>

<div id="log"></div>

</div>

</div>

<script>

/* =========================
   🧠 STATE MACHINE CORE
========================= */

const STATE = {
    mode: "DISARMED",
    alarm: false,
    panic: false,
    token: 0
};

let audioCtx;

/* =========================
   🧾 LOG SYSTEM
========================= */

function log(msg){
    const t = new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML += `[${t}] ${msg}<br>`;
}

/* =========================
   📟 STATUS
========================= */

function setStatus(){
    document.getElementById("status").innerText =
        STATE.mode + (STATE.alarm ? " | ALARM" : "");
}

/* =========================
   🔊 AUDIO ENGINE
========================= */

function beep(f=3000,d=0.12){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.frequency.value=f;
    o.type="square";

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    setTimeout(()=>o.stop(),d*1000);
}

/* =========================
   🔴 FLASH
========================= */

function flash(){
    document.body.style.background="rgba(255,0,0,0.5)";
    setTimeout(()=>document.body.style.background="#0b0f14",100);
}

/* =========================
   🚨 ALARM ENGINE (SAFE)
========================= */

function runAlarm(type, t){

    if(!STATE.alarm || STATE.token !== t) return;

    if(type==="smoke"){
        beep(); setTimeout(()=>beep(),200); setTimeout(()=>beep(),400);
    }

    if(type==="door"){
        beep(1800,0.2);
    }

    if(type==="motion"){
        beep(2800,0.1);
        setTimeout(()=>beep(2800,0.1),180);
    }

    flash();

    setTimeout(()=>{
        if(STATE.alarm && STATE.token===t){
            setTimeout(()=>runAlarm(type,t), STATE.panic?900:1800);
        }
    },600);
}

/* =========================
   🚨 TRIGGER
========================= */

function trigger(type){

    if(STATE.mode==="DISARMED") {
        log("IGNORED (DISARMED)");
        return;
    }

    if(!audioCtx) audioCtx = new AudioContext();

    STATE.alarm = true;
    STATE.token++;

    log("TRIGGER: "+type);

    runAlarm(type, STATE.token);
    setStatus();
}

/* =========================
   🧠 MODES
========================= */

function setMode(m){
    STATE.mode = m;
    STATE.alarm = false;
    STATE.panic = false;
    STATE.token++;

    log("MODE: "+m);
    setStatus();
}

/* =========================
   🧨 PANIC
========================= */

function panicMode(){

    if(!audioCtx) audioCtx = new AudioContext();

    STATE.panic = true;
    STATE.alarm = true;
    STATE.token++;

    log("PANIC ACTIVATED");

    let i=0;
    function strobe(){
        document.body.style.background="rgba(255,0,0,0.9)";
        setTimeout(()=>document.body.style.background="#0b0f14",60);

        if(i++<35) setTimeout(strobe,90);
    }
    strobe();

    runAlarm("motion", STATE.token);
    setStatus();
}

/* =========================
   ⛔ STOP
========================= */

function stopAll(){
    STATE.alarm = false;
    STATE.panic = false;
    STATE.token++;

    log("STOP ALL");
    setStatus();

    document.body.style.background="#0b0f14";
}

setStatus();

</script>

</body>
</html>
