<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Floorplan Security System</title>

<style>
body{
margin:0;
background:#05070c;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00ffcc;
}

.panel{
width:520px;
background:#0b0f14;
border:2px solid #1affc6;
box-shadow:0 0 25px #00ffcc33;
display:flex;
flex-direction:column;
}

/* FLOORPLAN */
.floor{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
background:#070a10;
}

.room{
border:1px solid #1affc6;
padding:18px;
text-align:center;
cursor:pointer;
background:#0d141d;
transition:0.2s;
}

.room:hover{background:#111a25;}

.ok{background:#0d141d;}
.open{background:#ff3b3b66;}
.trouble{background:#ffcc0040;}
.offline{background:#66666655;}

/* BOTTOM */
.bottom{
border-top:1px solid #1affc6;
padding:10px;
background:black;
}

.screen{
color:#00ff88;
min-height:70px;
white-space:pre-line;
}

.log{
height:120px;
overflow:auto;
font-size:11px;
margin-top:5px;
}
</style>
</head>

<body>

<div class="panel">

<div class="floor">

<div class="room" id="door" onclick="trigger('door')">DOOR</div>
<div class="room" id="window" onclick="trigger('window')">WINDOW</div>
<div class="room" id="motion" onclick="trigger('motion')">MOTION</div>
<div class="room" id="smoke" onclick="trigger('smoke')">SMOKE</div>

</div>

<div class="bottom">
<div class="screen" id="screen">SYSTEM READY</div>
<div class="log" id="log"></div>
</div>

</div>

<script>

/* ---------------- SYSTEM ---------------- */
let zones={
door:{state:"CLOSED",battery:100,online:true},
window:{state:"CLOSED",battery:100,online:true},
motion:{state:"CLOSED",battery:100,online:true},
smoke:{state:"CLOSED",battery:100,online:true}
};

let alarm=false;
let trouble=false;

/* ---------------- AUDIO SYSTEM ---------------- */
let audioCtx=null;
let osc=null;
let loop=null;

function initAudio(){
if(!audioCtx){
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
}

function stopSound(){
if(loop)clearInterval(loop);
loop=null;

if(osc){
try{osc.stop();}catch(e){}
osc.disconnect();
osc=null;
}
}

function beep(freq=800,duration=120,vol=0.03){
initAudio();

let o=audioCtx.createOscillator();
let g=audioCtx.createGain();

o.connect(g);
g.connect(audioCtx.destination);

o.type="square";
o.frequency.value=freq;
g.gain.value=vol;

o.start();

setTimeout(()=>{
o.stop();
o.disconnect();
},duration);
}

/* ---------------- SIRENS ---------------- */
function startAlarmSound(){
stopSound();

initAudio();
osc=audioCtx.createOscillator();
let g=audioCtx.createGain();

osc.connect(g);
g.connect(audioCtx.destination);

osc.type="square";
g.gain.value=0.05;

osc.start();

let up=false;

loop=setInterval(()=>{
osc.frequency.value=up?900:400;
up=!up;
},220);
}

function startFireSound(){
stopSound();

let pattern=[900,900,900,0,900,900,900,0];
let i=0;

loop=setInterval(()=>{
beep(pattern[i%pattern.length]);
i++;
},180);
}

function startTroubleSound(){
stopSound();

loop=setInterval(()=>{
beep(700,120,0.02);
},45000);
}

function stopAllSound(){
stopSound();
}

/* ---------------- UI ---------------- */
function screen(t){
document.getElementById("screen").innerText=t;
}

function log(m){
let t=new Date().toLocaleTimeString();
let el=document.createElement("div");
el.innerText=`[${t}] ${m}`;
document.getElementById("log").appendChild(el);
document.getElementById("log").scrollTop=999999;
}

/* ---------------- FLOOR ---------------- */
function updateFloor(){

for(let z in zones){
let el=document.getElementById(z);
let r=zones[z];

el.className="room ok";

if(r.state==="OPEN") el.classList.add("open");
if(!r.online) el.classList.add("offline");
if(r.battery<20) el.classList.add("trouble");

el.innerText=`${z.toUpperCase()}\n${r.state}`;
}
}

/* ---------------- LOGIC ---------------- */
function checkSystem(){

trouble=false;
alarm=false;

for(let z in zones){

if(!zones[z].online || zones[z].battery<20){
trouble=true;
}

if(zones[z].state==="OPEN"){
alarm=true;
}

}

if(alarm){
screen("ALARM ACTIVE");
startAlarmSound();
}

else if(trouble){
screen("SYSTEM TROUBLE");
startTroubleSound();
}

else{
screen("SYSTEM READY");
stopAllSound();
}
}

/* ---------------- SIMULATION ---------------- */
function simulate(){

for(let z in zones){

zones[z].battery-=Math.random()*0.2;

if(Math.random()<0.02){
zones[z].online=false;
log(z+" OFFLINE");
}

if(Math.random()<0.01){
zones[z].state="OPEN";
}

if(zones[z].battery<10){
zones[z].state="FAULT";
}

if(Math.random()<0.005){
zones[z].state="CLOSED";
zones[z].online=true;
}

}

checkSystem();
updateFloor();
}

/* ---------------- USER ACTION ---------------- */
function trigger(z){
zones[z].state="OPEN";
log(z+" TRIGGERED");
checkSystem();
updateFloor();
}

/* ---------------- LOOP ---------------- */
setInterval(simulate,3000);

/* INIT */
updateFloor();

</script>

</body>
</html>
