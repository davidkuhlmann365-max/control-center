<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Security Panel</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #0b0f14;
    color: #00ff9d;
}

header {
    padding: 10px;
    background: #111822;
    text-align: center;
    font-size: 20px;
    border-bottom: 2px solid #00ff9d;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

.panel {
    background: #111822;
    padding: 10px;
    border: 1px solid #00ff9d;
    border-radius: 6px;
}

.zone {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    margin: 5px 0;
    background: #0b0f14;
    border: 1px solid #222;
}

.active {
    color: red;
    font-weight: bold;
}

button {
    background: black;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    padding: 10px;
    cursor: pointer;
    width: 100%;
}

button:hover {
    background: #00ff9d;
    color: black;
}

#log {
    height: 150px;
    overflow-y: auto;
    font-size: 12px;
    background: black;
    padding: 5px;
}

video {
    width: 100%;
    border: 1px solid #00ff9d;
}
</style>
</head>

<body>

<header>🔒 SECURITY CONTROL PANEL</header>

<div class="container">

    <div class="panel">
        <h3>Zonen Status</h3>

        <div class="zone" onclick="toggleZone(this)">Door <span>OFF</span></div>
        <div class="zone" onclick="toggleZone(this)">Window <span>OFF</span></div>
        <div class="zone" onclick="toggleZone(this)">Motion <span>OFF</span></div>

        <br>
        <button onclick="triggerAlarm()">🚨 ALARM TEST</button>
        <button onclick="resetSystem()">RESET</button>
    </div>

    <div class="panel">
        <h3>Live Kamera (optional)</h3>
        <video id="cam" autoplay></video>
        <button onclick="startCam()">Kamera starten</button>
    </div>

    <div class="panel">
        <h3>Event Log</h3>
        <div id="log"></div>
    </div>

    <div class="panel">
        <h3>Status</h3>
        <p id="status">System bereit</p>
    </div>

</div>

<audio id="siren">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
function log(msg){
    const logBox = document.getElementById("log");
    const time = new Date().toLocaleTimeString();
    logBox.innerHTML += `[${time}] ${msg}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
}

function toggleZone(el){
    const span = el.querySelector("span");
    if(span.innerText === "OFF"){
        span.innerText = "ON";
        span.classList.add("active");
        log(el.innerText.split(" ")[0] + " aktiviert");
    } else {
        span.innerText = "OFF";
        span.classList.remove("active");
        log(el.innerText.split(" ")[0] + " deaktiviert");
    }
}

function triggerAlarm(){
    document.getElementById("status").innerText = "⚠ ALARM AKTIV!";
    log("ALARM ausgelöst!");
    document.getElementById("siren").play();
}

function resetSystem(){
    document.querySelectorAll(".zone span").forEach(s=>{
        s.innerText = "OFF";
        s.classList.remove("active");
    });
    document.getElementById("status").innerText = "System bereit";
    log("System zurückgesetzt");
}

function startCam(){
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        document.getElementById("cam").srcObject = stream;
        log("Kamera gestartet");
    })
    .catch(err => {
        log("Kamera blockiert: " + err.message);
    });
}
</script>

</body>
</html>
