<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V7.4 ADT FIRE + SECURITY PANEL</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #060a12;
    color: #00ffcc;
}

#app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #00ffcc33;
    font-size: 18px;
}

.status {
    text-align: center;
    padding: 8px;
    font-size: 16px;
}

.panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px;
}

input {
    font-size: 18px;
    padding: 6px;
    text-align: center;
    width: 160px;
}

button {
    padding: 6px 8px;
    margin: 3px;
    background: #00ffcc;
    border: none;
}

button:hover {
    background: #00ccaa;
}

.zones {
    display: flex;
    gap: 8px;
}

.zone {
    border: 1px solid #00ffcc44;
    padding: 8px;
    width: 80px;
    text-align: center;
    cursor: pointer;
}

.zone.active {
    background: #003d33;
}

.log {
    flex: 1;
    font-size: 12px;
    background: #0a0f18;
    overflow-y: auto;
    padding: 6px;
    border-top: 1px solid #00ffcc33;
}

.red { color: #ff4d4d; }
.yellow { color: #ffd24d; }
.blue { color: #4da6ff; }
</style>
</head>

<body>

<div id="app">

<div class="header">📟 V7.4 ADT SECURITY + FIRE SYSTEM</div>

<div class="status" id="status">Status: DISARMED</div>

<div class="panel">

<input id="pin" placeholder="PIN">

<div>
<button onclick="arm()">ARM</button>
<button onclick="disarm()">DISARM</button>
<button onclick="triggerSmoke()">SMOKE TEST</button>
<button onclick="toggleSignal()">SIGNAL</button>
</div>

<div class="zones">
<div class="zone" id="door" onclick="toggleZone('door')">DOOR</div>
<div class="zone" id="window" onclick="toggleZone('window')">WINDOW</div>
<div class="zone" id="motion" onclick="toggleZone('motion')">MOTION</div>
<div class="zone" id="camera" onclick="cameraTamper()">CAM</div>
<div class="zone" id="smoke" onclick="triggerSmoke()">SMOKE</div>
</div>

</div>

<div class="log" id="log"></div>

</div>

<script>
let correctPIN = "1234";

let armed = false;
let signal = true;

let zones = { door:false, window:false, motion:false };

let alarmState = "none"; 
// none | security | fire

let lastTrigger = 0;

// ---------------- LOG ----------------
function log(msg, type="") {
    let time = new Date().toLocaleTimeString();
    document.getElementById("log").innerHTML +=
    `<span class="${type}">[${time}] ${msg}</span><br>`;
    document.getElementById("log").scrollTop = 999999;
}

// ---------------- STATUS ----------------
function setStatus(text) {
    document.getElementById("status").innerText = "Status: " + text;
}

// ---------------- ANTI SPAM ----------------
function canTrigger() {
    let now = Date.now();
    if (now - lastTrigger < 800) return false;
    lastTrigger = now;
    return true;
}

// ---------------- AUDIO ENGINE (NO WECKER) ----------------
let audioCtx = null;
let osc = null;

function startTone(type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    stopTone();

    osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "security") {
        osc.frequency.value = 220; // low siren
    } else if (type === "fire") {
        osc.frequency.value = 880; // higher emergency tone
    }

    gain.gain.value = 0.08;

    osc.type = "square";
    osc.start();
}

function stopTone() {
    if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
    }
}

// ---------------- SECURITY ALARM ----------------
function securityAlarm(reason) {
    if (alarmState === "fire") return;

    if (!canTrigger()) return;

    alarmState = "security";

    setStatus("SECURITY ALARM");
    log("SECURITY: " + reason, "blue");

    startTone("security");
}

// ---------------- FIRE ALARM (PRIORITY) ----------------
function fireAlarm(reason) {
    if (!canTrigger()) return;

    alarmState = "fire";

    setStatus("🔥 FIRE ALARM");

    log("FIRE: " + reason, "red");

    stopTone();
    startTone("fire");

    if (navigator.vibrate) {
        navigator.vibrate([300,200,300,200,600]);
    }
}

// ---------------- SYSTEM ----------------
function arm() {
    armed = true;
    setStatus("ARMED");
    log("System armed");
}

function disarm() {
    let pin = document.getElementById("pin").value;

    if (pin === correctPIN) {
        armed = false;
        alarmState = "none";
        stopTone();
        setStatus("DISARMED");
        log("System disarmed");
    } else {
        log("WRONG PIN", "red");
        securityAlarm("Wrong PIN");
    }

    document.getElementById("pin").value = "";
}

// ---------------- ZONES ----------------
function toggleZone(z) {
    zones[z] = !zones[z];
    document.getElementById(z).classList.toggle("active");

    log("ZONE " + z.toUpperCase() + " " + (zones[z] ? "ON" : "OFF"));

    if (armed && zones[z]) {
        securityAlarm("Zone trigger: " + z);
    }
}

// ---------------- CAMERA ----------------
function cameraTamper() {
    log("CAM TAMPER", "red");
    if (armed) securityAlarm("Camera tamper");
}

// ---------------- SMOKE (ALWAYS ACTIVE) ----------------
function triggerSmoke() {
    fireAlarm("Smoke detected");
}

// ---------------- SIGNAL ----------------
function toggleSignal() {
    signal = !signal;
    log("Signal: " + (signal ? "ONLINE" : "LOST"),
    signal ? "" : "yellow");

    setStatus(signal ? (armed ? "ARMED" : "DISARMED") : "SIGNAL LOST");
}
</script>

</body>
</html>
