<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Security Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #00ff9d;
    }
    header {
      padding: 20px;
      background: #111822;
      text-align: center;
      font-size: 24px;
      border-bottom: 2px solid #00ff9d;
    }
    .container {
      padding: 20px;
    }
    #alarm-banner {
      display: none;
      background: red;
      color: white;
      font-size: 28px;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      border-radius: 5px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    button {
      background: black;
      color: #00ff9d;
      border: 1px solid #00ff9d;
      padding: 15px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #00ff9d;
      color: black;
    }
    #log {
      height: 150px;
      overflow-y: auto;
      background: black;
      color: white;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>🔒 SECURITY CONTROL PANEL</header>
  <div class="container">
    <button onclick="triggerSmokeAlarm()">🚨 Rauchalarm auslösen</button>

    <div id="alarm-banner">
      🔥 Rauchalarm! Bitte sofort überprüfen!
    </div>

    <div id="log">
      <!-- Ereignisse werden hier angezeigt -->
    </div>
  </div>

  <script>
    function triggerSmokeAlarm() {
      const banner = document.getElementById("alarm-banner");
      banner.style.display = "block";
      logEvent("Rauchalarm ausgelöst");
    }

    function logEvent(message) {
      const logBox = document.getElementById("log");
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `[${time}] ${message}<br>`;
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Tablet V6</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0f14;
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#1a2a3a,#05070a);
}

.box{
  background:#111824;
  padding:20px;
  border-radius:10px;
  width:300px;
  text-align:center;
}

#display{
  font-size:26px;
  letter-spacing:4px;
  background:black;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
}

/* KEYPAD */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.keypad button{
  padding:12px;
  background:#1f6feb;
  border:none;
  color:white;
  border-radius:6px;
  font-size:16px;
}

/* APP */
#app{
  display:none;
  height:100vh;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  background:#111824;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* GRID */
.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
  padding:10px;
  overflow:auto;
}

.card{
  background:#121a26;
  border-radius:10px;
  padding:10px;
}

/* STATUS */
.green{color:#7ee787}
.yellow{color:orange}
.red{color:red}

/* ALARM */
.alarm{
  animation:flash .25s infinite;
}

@keyframes flash{
  0%{background:red}
  50%{background:black}
  100%{background:red}
}

.lockdown{
  filter:grayscale(1);
}

/* CAM */
video{
  width:100%;
  border-radius:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h3>SECURITY PANEL</h3>

    <div id="display">----</div>

    <div class="keypad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>
      <button onclick="clearPin()">C</button>
      <button onclick="press(0)">0</button>
      <button onclick="submit()">OK</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div id="state">🟢 SYSTEM READY</div>
  </div>

  <div class="grid">

    <div class="card">
      <h3>THREAT LEVEL</h3>
      <div id="threat">GREEN</div>
    </div>

    <div class="card">
      <h3>ZONES</h3>
      <div>Door: OK</div>
      <div>Motion: OK</div>
      <div>Window: OK</div>
    </div>

    <div class="card">
      <h3>CAMERA</h3>
      <video id="cam" autoplay muted playsinline></video>
    </div>

    <div class="card">
      <h3>LOG</h3>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>

const PIN = "1234";

let input = "";
let attempts = 0;

let audio;
let alarm = false;

/* AUDIO INIT */
function initAudio(){
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if(audio.state === "suspended") audio.resume();
}

/* KEYPAD */
function press(n){
  if(input.length < 4) input += n;
  update();
}

function clearPin(){
  input = "";
  update();
}

function update(){
  document.getElementById("display").innerText =
    input.padEnd(4, "-");
}

/* LOGIN CHECK */
function submit(){
  initAudio();

  if(input === PIN){
    start();
  } else {
    attempts++;
    input = "";
    update();

    if(attempts >= 3){
      lockdown();
    } else {
      alarmStart();
    }
  }
}

/* START SYSTEM */
function start(){
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
  log("SYSTEM ARMED");
  camera();
}

/* LOG */
function log(msg){
  document.getElementById("log").innerHTML =
    `[${new Date().toLocaleTimeString()}] ${msg}<br>` +
    document.getElementById("log").innerHTML;
}

/* CAMERA */
async function camera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById("cam").srcObject = stream;
    log("CAM ONLINE");
  } catch(e){
    log("CAM BLOCKED");
    alarmStart();
  }
}

/* 🔊 IMPROVED ALARM (ruhiger, Anti-Theft Style) */
function alarmStart(){
  if(alarm) return;
  alarm = true;

  document.body.classList.add("alarm");

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = "triangle";   // 🔥 softer sound
  gain.gain.value = 0.15;  // 🔥 quieter

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  let t = 0;

  const loop = setInterval(() => {
    if(!alarm){
      clearInterval(loop);
      return;
    }

    // 🔊 slow siren sweep (less annoying, more realistic)
    const freq = 220 + Math.sin(t) * 120;
    osc.frequency.setValueAtTime(freq, audio.currentTime);

    t += 0.25;
  }, 120);
}

/* LOCKDOWN */
function lockdown(){
  document.body.classList.add("lockdown");
  document.getElementById("threat").innerText = "CRITICAL";
  log("LOCKDOWN ACTIVATED");
  alarmStart();
}

</script>

</body>
</html>
