<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart Doorbell / Security Dashboard</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
  }

  header {
    background: #111826;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    padding: 12px;
  }

  .card {
    background: #151d2b;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
  }

  .status {
    opacity: 0.8;
    margin-top: 8px;
  }

  .alarm-on {
    background: #ff2b2b !important;
  }

  button {
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-alarm {
    background: #ff2b2b;
    color: white;
  }

  .btn-stop {
    background: #2ecc71;
    color: white;
  }
</style>
</head>

<body>

<header>🛡️ Smart Doorbell Security Panel</header>

<div class="grid">
  <div class="card" id="alarmCard">
    <h3>Alarmanlage</h3>
    <div class="status" id="status">Status: AUS</div>

    <button class="btn-alarm" onclick="startAlarm()">ALARM AUSLÖSEN</button>
    <button class="btn-stop" onclick="stopAlarm()">STOP</button>
  </div>

  <div class="card">
    <h3>Kamera</h3>
    <div class="status">LIVE (Demo)</div>
  </div>

  <div class="card">
    <h3>System</h3>
    <div class="status">OK</div>
  </div>
</div>

<script>
let alarmActive = false;

// MP3 Alarm
let alarmAudio = new Audio("alarm.mp3");
alarmAudio.loop = true;
alarmAudio.volume = 1;

// 🔥 Verstärkung über Web Audio API
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
const source = audioContext.createMediaElementSource(alarmAudio);
const gainNode = audioContext.createGain();

// Lautstärke-Boost (anpassen falls nötig)
gainNode.gain.value = 3.0;

source.connect(gainNode);
gainNode.connect(audioContext.destination);

function startAlarm() {
  if (alarmActive) return;

  alarmActive = true;

  document.getElementById("status").innerText = "Status: ALARM!";
  document.getElementById("alarmCard").classList.add("alarm-on");

  // Browser Audio freischalten
  audioContext.resume();

  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(err => {
    console.log("Audio blocked:", err);
  });
}

function stopAlarm() {
  alarmActive = false;

  document.getElementById("status").innerText = "Status: AUS";
  document.getElementById("alarmCard").classList.remove("alarm-on");

  alarmAudio.pause();
  alarmAudio.currentTime = 0;
}
</script>

</body>
</html>
