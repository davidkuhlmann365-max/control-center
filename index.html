<button class="doorbell" onclick="doorbellSync()">
🚪 Klingel (SYNC)
</button>

<script>
function addLog(text){
    const log = document.getElementById("log");
    const t = new Date().toLocaleTimeString();
    log.innerHTML += `[${t}] ${text}<br>`;
    log.scrollTop = log.scrollHeight;
}

function doorbellSync(){

    // sofort UI Feedback
    addLog("🚪 Klingel ausgelöst (SYNC)");

    // Server triggert ALLES gleichzeitig
    fetch("http://192.168.178.33:5000/doorbell")
        .then(() => {
            addLog("📡 Server bestätigt Trigger");
        })
        .catch(() => {
            addLog("❌ Server nicht erreichbar");
        });

    // optional lokaler UI Sound fallback
    const audio = new Audio("sounds/gong.mp3");
    audio.play();
}
</script>
