<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floorplan Security Panel</title>

<style>
body{
margin:0;
background:#05070c;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#00ffcc;
}

/* PANEL WRAPPER */
.panel{
width:520px;
background:#0b0f14;
border:2px solid #1affc6;
box-shadow:0 0 25px #00ffcc33;
display:flex;
flex-direction:column;
}

/* FLOORPLAN */
.floor{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
background:#070a10;
}

.room{
border:1px solid #1affc6;
padding:20px;
text-align:center;
cursor:pointer;
background:#0d141d;
transition:0.2s;
}

.room:hover{
background:#111a25;
}

/* STATUS COLORS */
.ok{background:#0d141d;}
.open{background:#ffcc0030;}
.alarm{background:#ff3b3b60;}
.trouble{background:#ffcc0030;}
.offline{background:#66666640;}

/* BOTTOM PANEL */
.bottom{
border-top:1px solid #1affc6;
padding:10px;
background:black;
}

.screen{
color:#00ff88;
min-height:60px;
white-space:pre-line;
}

.log{
height:120px;
overflow:auto;
font-size:11px;
margin-top:5px;
}
</style>
</head>

<body>

<div class="panel">

<!-- FLOORPLAN -->
<div class="floor">

<div class="room" id="door" onclick="test('door')">DOOR</div>
<div class="room" id="window" onclick="test('window')">WINDOW</div>
<div class="room" id="motion" onclick="test('motion')">MOTION</div>
<div class="room" id="smoke" onclick="test('smoke')">SMOKE</div>

</div>

<!-- BOTTOM PANEL -->
<div class="bottom">

<div class="screen" id="screen">SYSTEM READY</div>

<div class="log" id="log"></div>

</div>

</div>

<script>

/* ---------------- SYSTEM ---------------- */
let zones={
door:{state:"CLOSED",battery:100,online:true},
window:{state:"CLOSED",battery:100,online:true},
motion:{state:"CLOSED",battery:100,online:true},
smoke:{state:"CLOSED",battery:100,online:true}
};

let alarm=false;
let trouble=false;

/* ---------------- UI ---------------- */
function screen(t){
document.getElementById("screen").innerText=t;
}

function log(m){
let t=new Date().toLocaleTimeString();
let el=document.createElement("div");
el.innerText=`[${t}] ${m}`;
document.getElementById("log").appendChild(el);
document.getElementById("log").scrollTop=999999;
}

/* ---------------- FLOOR UPDATE ---------------- */
function updateFloor(){

for(let z in zones){
let el=document.getElementById(z);
let r=zones[z];

el.className="room ok";

/* ALARM */
if(r.state==="OPEN") el.classList.add("open");
if(r.state==="ALARM") el.classList.add("alarm");

/* TROUBLE */
if(!r.online) el.classList.add("offline");
if(r.battery<20) el.classList.add("trouble");

el.innerText=`${z.toUpperCase()}
${r.state}`;
}
}

/* ---------------- SIMULATION ---------------- */
function simulate(){

for(let z in zones){

zones[z].battery-=Math.random()*0.3;

if(Math.random()<0.02){
zones[z].online=false;
log(z+" OFFLINE");
}

if(Math.random()<0.01){
zones[z].state="OPEN";
}

if(zones[z].battery<15){
zones[z].state="FAULT";
}

if(Math.random()<0.005){
zones[z].state="CLOSED";
zones[z].online=true;
}
}

checkSystem();
updateFloor();
}

/* ---------------- SYSTEM LOGIC ---------------- */
function checkSystem(){

trouble=false;

for(let z in zones){
if(!zones[z].online || zones[z].state==="FAULT") trouble=true;
if(zones[z].state==="OPEN") alarm=true;
}

if(alarm){
screen("ALARM ACTIVE");
}

else if(trouble){
screen("SYSTEM TROUBLE");
}

else{
screen("SYSTEM READY");
}
}

/* ---------------- INTERACTION ---------------- */
function test(z){
zones[z].state="OPEN";
log(z+" TRIGGERED");
updateFloor();
checkSystem();
}

/* ---------------- LOOP ---------------- */
setInterval(simulate,3000);

/* INIT */
updateFloor();

</script>

</body>
</html>
