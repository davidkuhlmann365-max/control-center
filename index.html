<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V7 Smart Home Security</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body{
    margin:0;
    background:#000;
    color:#00ff99;
    font-family:monospace;
}

#login,#app{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#app{display:none;padding:10px;}

.panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
}

.box{
    border:1px solid #00ff99;
    padding:10px;
}

button{margin:3px;padding:6px;}

.danger{color:red;font-weight:bold;}

.log{
    height:120px;
    overflow:auto;
    font-size:12px;
    border:1px solid #00ff99;
    padding:5px;
}

video{width:100%;border:1px solid #00ff99;}

.house{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

.zone{
    border:1px solid #00ff99;
    padding:8px;
    text-align:center;
    cursor:pointer;
}

.zone.active{background:red;color:white;}
</style>
</head>

<body>

<div id="login">
<h2>🔐 V7 LOGIN</h2>
<input id="pin" type="password" placeholder="PIN">
<button onclick="login()">ENTER</button>
</div>

<div id="app">

<h2>🏠 V7 SMART HOME SECURITY</h2>

<div class="panel">

<div class="box">
<h3>STATUS</h3>
<p id="status">DISARMED</p>
<button onclick="arm()">ARM</button>
<button onclick="disarm()">DISARM</button>
<button onclick="toggleSilent()">🔕 Silent</button>
</div>

<div class="box">
<h3>HOUSE ZONES</h3>
<div class="house">
<div class="zone" onclick="fakeTrigger('DOOR')">🚪 DOOR</div>
<div class="zone" onclick="fakeTrigger('WINDOW')">🪟 WINDOW</div>
<div class="zone" onclick="fakeTrigger('MOTION')">🕵️ MOTION</div>
<div class="zone" onclick="fakeTrigger('GARAGE')">🚗 GARAGE</div>
</div>
</div>

<div class="box">
<h3>AI CAMERA</h3>
<video id="cam" autoplay playsinline></video>
<canvas id="c" style="display:none;"></canvas>
<p id="motion">idle</p>
</div>

<div class="box">
<h3>RECORDING</h3>
<video id="recplay" controls></video>
</div>

<div class="box">
<h3>LOG</h3>
<div class="log" id="log"></div>
</div>

</div>

</div>

<audio id="alarm" loop>
<source src="alarm.mp3">
</audio>

<script>
const PIN="1234";

let armed=false;
let alarm=false;
let silent=false;
let lastFrame=null;

let audio=document.getElementById("alarm");

let recorder;
let chunks=[];

function log(t){
let l=document.getElementById("log");
l.innerHTML+="["+new Date().toLocaleTimeString()+"] "+t+"<br>";
l.scrollTop=l.scrollHeight;
}

function setStatus(t){
document.getElementById("status").innerHTML=t;
}

// 🔐 brute force delay
let attempts=0;
function login(){
let p=document.getElementById("pin").value;

if(p===PIN){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="flex";
startCam();
log("LOGIN OK");
attempts=0;
}else{
attempts++;
log("WRONG PIN");
if(attempts>3){
setTimeout(()=>attempts=0,5000);
log("ANTI BRUTE FORCE DELAY");
}
}
}

function arm(){
armed=true;
setStatus("ARMED");
log("ARMED");
}

function disarm(){
armed=false;
stopAlarm();
setStatus("DISARMED");
log("DISARMED");
}

function toggleSilent(){
silent=!silent;
log("Silent: "+silent);
}

// 📳 vibration
function vibrate(){
if(!navigator.vibrate) return;
navigator.vibrate([200,100,300,100,600]);
}

// 🚨 alarm
function trigger(reason){
if(alarm || !armed) return;

alarm=true;
setStatus("🚨 ALARM ACTIVE");
log("ALARM: "+reason);

if(!silent){
audio.currentTime=0;
audio.play().catch(()=>log("audio blocked"));
}

vibrate();
startRecording();
}

// 🛑 stop
function stopAlarm(){
alarm=false;
audio.pause();
audio.currentTime=0;
stopRecording();
}

// 🧠 motion AI
function startCam(){
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>{
document.getElementById("cam").srcObject=s;
motionAI();
});
}

function motionAI(){
let v=document.getElementById("cam");
let c=document.getElementById("c");
let ctx=c.getContext("2d");

setInterval(()=>{
if(!armed || v.readyState<2) return;

c.width=v.videoWidth;
c.height=v.videoHeight;

ctx.drawImage(v,0,0);
let f=ctx.getImageData(0,0,c.width,c.height);

if(lastFrame){
let diff=0;
for(let i=0;i<f.data.length;i+=60){
diff+=Math.abs(f.data[i]-lastFrame.data[i]);
}

document.getElementById("motion").innerText="motion:"+diff;

if(diff>10000){
trigger("MOTION DETECTED");
}
}

lastFrame=f;
},300);
}

// 🏠 fake zone trigger
function fakeTrigger(z){
trigger(z);
}

// 📹 recording
function startRecording(){
navigator.mediaDevices.getUserMedia({video:true,audio:false})
.then(stream=>{
recorder=new MediaRecorder(stream);
chunks=[];

recorder.ondataavailable=e=>chunks.push(e.data);
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:"video/webm"});
let url=URL.createObjectURL(blob);
document.getElementById("recplay").src=url;
};

recorder.start();
log("RECORDING START");
});
}

function stopRecording(){
if(recorder && recorder.state==="recording"){
recorder.stop();
log("RECORDING STOP");
}
}
</script>

</body>
</html>
